<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horarios · Aula Docente</title>
<meta name="theme-color" content="#1e3a8a">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#e2e8f0; --line2:#cbd5e1;
  --pri:#1d4ed8; --pri2:#1e3a8a; --pri-soft:#e8efff; --acc:#f59e0b; --ok:#15803d; --ok-soft:#e8f7ee; --warn:#b45309; --warn-soft:#fff6e5; --bad:#dc2626; --bad-soft:#fdecec;
  --r:14px; --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
a{color:var(--pri)}
header.top{background:linear-gradient(120deg,#0f1f4d,#1e3a8a 55%,#1d4ed8);color:#fff;padding:14px 22px 0;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(15,23,42,.18)}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;background:none;border:0;color:#fff;padding:0;text-align:left}
.logo{width:38px;height:38px;border-radius:10px;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:6px;flex:none}
.logo i{border-radius:2px;background:#c7d2fe}.logo i:nth-child(1),.logo i:nth-child(5),.logo i:nth-child(9){background:#1d4ed8}.logo i:nth-child(3),.logo i:nth-child(7){background:#f59e0b}
.brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.01em}
.brand p{margin:0;font-size:12px;opacity:.75}
nav#nav{display:flex;gap:2px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
nav#nav::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:#c7d2fe;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover{color:#fff;background:rgba(255,255,255,.08)}
.tab.on{background:var(--bg);color:var(--pri2)}
.tab .num{font-size:11px;width:19px;height:19px;border-radius:50%;display:inline-grid;place-items:center;background:rgba(255,255,255,.16)}
.tab.on .num{background:var(--pri);color:#fff}
main{max-width:1480px;margin:0 auto;padding:20px 22px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
h2{font-size:18px;margin:0 0 8px;letter-spacing:-.01em}
h3{font-size:15px;margin:18px 0 8px}
h4{font-size:13px;margin:14px 0 6px;color:var(--ink2)}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin:6px 0 12px}
.row{display:flex;align-items:center}.between{justify-content:space-between;gap:12px;flex-wrap:wrap}.gap{gap:8px;flex-wrap:wrap}.wrap{flex-wrap:wrap}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.cols.disp{grid-template-columns:300px 1fr}
.cols.wide-left{grid-template-columns:minmax(0,1fr) 320px}
@media (max-width:1000px){.cols,.cols.disp,.cols.wide-left{grid-template-columns:1fr}}
.btn{border:1px solid var(--line2);background:#fff;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);transition:.15s}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}.btn.primary:hover{background:var(--pri2);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:#f3c4c4}.btn.danger:hover{background:var(--bad-soft)}
.btn.primary.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.big{padding:12px 20px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--muted);font-size:14px}
.icon-btn:hover{color:var(--bad);border-color:var(--bad)}
#prev,#next{font-size:18px}#prev:hover,#next:hover{color:var(--pri);border-color:var(--pri)}
.form{display:grid;gap:12px}
.form label{display:grid;gap:5px;font-weight:600;font-size:13px;color:var(--ink2)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form.four{grid-template-columns:repeat(4,1fr);margin-top:10px}
@media (max-width:800px){.form.four{grid-template-columns:1fr 1fr}}
input,select{border:1px solid var(--line2);border-radius:9px;padding:7px 10px;background:#fff;min-width:0}
input:focus,select:focus{outline:2px solid #bfd3ff;border-color:var(--pri)}
input[type=color]{padding:2px;width:34px;height:30px}
input[type=range]{padding:0;border:0;accent-color:var(--pri)}
.check{display:flex!important;align-items:center;gap:8px;font-weight:500!important;margin:6px 0}
.w80{width:80px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line2);border-radius:999px;padding:5px 12px;cursor:pointer;background:#fff;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;user-select:none}
.chip input{display:none}
.chip.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri2)}
.chips.small .chip{padding:3px 10px;font-size:12px}
.badge{background:#e2e8f0;color:var(--ink2);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700}
.badge.red{background:var(--bad-soft);color:var(--bad)}.badge.soft{background:var(--warn-soft);color:var(--warn)}
.tbl-wrap{overflow:auto;max-width:100%}
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:8px;border-bottom:1px solid var(--line);background:#f8fafc;position:sticky;top:0;z-index:1}
.tbl td{padding:4px 6px;border-bottom:1px solid #f1f5f9}
.tbl.edit td input:not([type=color]),.tbl.edit td select{width:100%;border-color:transparent;background:transparent}
.tbl.edit td input:hover,.tbl.edit td select:hover{border-color:var(--line2);background:#fff}
.tbl.edit td select.warn{border-color:#fca5a5;background:var(--bad-soft)}
.tbl.compact td{padding:5px 8px}
.tbl tr.brk td{background:#fef3c7;color:#92400e;font-weight:600;font-size:12px}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:600}
.tbl .empty{text-align:center;color:var(--muted);padding:30px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.subtab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px}
.subtab.on{background:var(--pri);border-color:var(--pri);color:#fff}.subtab.on .badge{background:rgba(255,255,255,.25);color:#fff}
.filters{margin:0 0 10px}.filters label{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.import{padding:0;overflow:hidden}
.import-drop{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 20px;border:2px dashed transparent;border-radius:var(--r);flex-wrap:wrap}
.import-drop p{margin:4px 0 0;max-width:760px;font-size:13px}
.import-drop.over{border-color:var(--pri);background:var(--pri-soft)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;background:linear-gradient(135deg,#fff,#eef3ff);border:1px solid var(--line);border-radius:20px;padding:30px;margin-bottom:16px;box-shadow:var(--shadow)}
.hero h1{font-size:30px;line-height:1.15;margin:0 0 12px;letter-spacing:-.02em}
.lead{font-size:15px;color:var(--ink2);margin:0 0 20px;max-width:560px}
.steps{display:grid;gap:6px}
.step{display:grid;grid-template-columns:30px 1fr;grid-template-rows:auto auto;column-gap:10px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;cursor:pointer}
.step:hover{border-color:var(--pri)}
.step .num{grid-row:1/3;width:28px;height:28px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-weight:800;align-self:center}
.step small{color:var(--muted)}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.grid.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
@media (max-width:900px){.grid.stats{grid-template-columns:repeat(3,1fr)}}
.stat{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.stat small{display:block;color:var(--muted);font-weight:600}.stat b{font-size:22px}
.ok-line{color:var(--ok);font-weight:600}
.seg{display:inline-flex;background:#eef2f7;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--pri2);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.side .search{width:100%;margin:10px 0}
.list{display:grid;gap:2px;max-height:560px;overflow:auto}
.li{display:flex;justify-content:space-between;align-items:center;border:0;background:none;text-align:left;padding:7px 10px;border-radius:8px;cursor:pointer;gap:8px}
.li:hover{background:#f1f5f9}.li.on{background:var(--pri-soft);color:var(--pri2);font-weight:700}
.quick{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.quick select{padding:4px 8px}
.grid-av{border-collapse:separate;border-spacing:4px;user-select:none}
.grid-av th{font-size:12px;padding:6px 8px;color:var(--ink2);cursor:pointer}
.grid-av th small{display:block;color:var(--muted);font-weight:500}
.grid-av td.av{width:110px;height:38px;border-radius:8px;background:var(--ok-soft);border:1px solid #bfe5cc;cursor:pointer}
.grid-av td.av:hover{filter:brightness(.96)}
.grid-av td.av.x{background:repeating-linear-gradient(45deg,#fecaca,#fecaca 6px,#fde2e2 6px,#fde2e2 12px);border-color:#f87171}
.grid-av.soft td.av.x{background:repeating-linear-gradient(45deg,#fde68a,#fde68a 6px,#fef3c7 6px,#fef3c7 12px);border-color:#f59e0b}
.grid-av tr.brk td{text-align:center;font-size:11px;color:#92400e;background:#fef3c7;border-radius:6px;padding:2px}
.legend{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;margin-left:8px}.sw.ok{background:var(--ok-soft);border:1px solid #bfe5cc}.sw.x{background:#fecaca;border:1px solid #f87171}
.proj .title-in{font-size:17px;font-weight:700;border:0;border-bottom:1px dashed var(--line2);border-radius:0;padding:4px 0;flex:1;min-width:200px}
.rules{padding-left:18px}.rules li{margin:6px 0}
.pref{display:grid;grid-template-columns:1fr 160px 40px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9}
.pref small{display:block;color:var(--muted)}
.pref output{font-weight:800;color:var(--pri);text-align:right}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 16px}
.kpis div{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px}
.kpis small{display:block;color:var(--muted);font-size:12px}.kpis b{font-size:20px}
.prog{margin:16px 0}.prog.hidden{display:none}
.bar{height:10px;border-radius:99px;background:#e2e8f0;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#60a5fa);border-radius:99px;transition:width .25s}
.prog-txt{font-size:13px;color:var(--ink2);margin-top:6px;font-variant-numeric:tabular-nums}
.alert{border-radius:10px;padding:10px 14px;margin:10px 0;border:1px solid}
.alert ul{margin:6px 0 0;padding-left:18px}.alert li{margin:3px 0}
.alert.error{background:var(--bad-soft);border-color:#fca5a5;color:#7f1d1d}
.alert.warn{background:var(--warn-soft);border-color:#fcd34d;color:#78350f}
.alert.ok{background:var(--ok-soft);border-color:#86efac;color:#14532d}
.alert.info{background:#f8fafc;border-color:var(--line);color:var(--ink2)}
.alert summary{cursor:pointer;font-weight:600}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px}
.toolbar select{min-width:220px}
.status-line{padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13px}
.status-line.good{background:var(--ok-soft);color:#14532d}.status-line.bad{background:var(--bad-soft);color:#7f1d1d}
table.horario{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed;min-width:640px}
table.horario th{font-size:12px;color:var(--ink2);padding:6px}
table.horario th.hcol{width:78px;text-align:center}
table.horario th.hcol b{display:block;font-size:14px;color:var(--ink)}
table.horario th.hcol small{color:var(--muted);font-weight:500;font-size:11px}
table.horario td{height:64px;border-radius:10px;vertical-align:top;padding:7px 9px;position:relative;cursor:pointer}
table.horario td.free{background:#f8fafc;border:1px dashed var(--line2)}
table.horario td.free.blocked{background:repeating-linear-gradient(45deg,#f1f5f9,#f1f5f9 6px,#fff 6px,#fff 12px);cursor:default}
table.horario td.free.blocked small{color:var(--muted);font-size:11px}
table.horario td.free.drop:hover{background:var(--pri-soft);border-color:var(--pri)}
table.horario td.cls{border-left:4px solid var(--c)}
table.horario td.cls:hover{box-shadow:0 0 0 2px var(--c) inset}
table.horario td.cls b{display:block;font-size:13px;line-height:1.2}
table.horario td.cls small{display:block;font-size:11px;color:var(--ink2);margin-top:3px;line-height:1.25}
table.horario td.cont{opacity:.85}
table.horario td.act{background:repeating-linear-gradient(135deg,#f1f5f9,#f1f5f9 8px,#e8edf3 8px,#e8edf3 16px)!important}
table.horario td.sel{box-shadow:0 0 0 3px var(--pri) inset!important}
table.horario td.bad{box-shadow:0 0 0 2px var(--bad) inset;background:var(--bad-soft)!important}
table.horario td .lock{position:absolute;right:6px;top:4px;font-size:11px}
table.horario td .blk{position:absolute;right:6px;bottom:4px;font-size:10px;color:var(--muted);font-weight:700}
table.horario td .more{position:absolute;left:8px;bottom:4px;font-size:10px;color:var(--bad);font-weight:700}
table.horario tr.brk td{height:auto;text-align:center;font-size:11px;font-weight:600;background:#fef3c7;color:#92400e;padding:3px;cursor:default}
table.sabana{border-collapse:collapse;font-size:11px}
table.sabana th{background:#f8fafc;padding:5px 6px;border:1px solid var(--line);position:sticky;top:0;z-index:1;white-space:nowrap}
table.sabana th.dcol{writing-mode:vertical-rl;transform:rotate(180deg);background:#eef2ff;color:var(--pri2);position:static}
table.sabana th.pcol{position:static}
table.sabana td{border:1px solid var(--line);padding:3px 5px;min-width:84px;cursor:pointer;vertical-align:top}
table.sabana td{max-width:120px;overflow:hidden}table.sabana td b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}table.sabana td small{color:var(--ink2);white-space:nowrap}
table.sabana tr.daystart td,table.sabana tr.daystart th{border-top:2px solid var(--pri2)}
table.sabana td.sel{outline:2px solid var(--pri)}table.sabana td.bad{outline:2px solid var(--bad)}
.side-info h3:first-child{margin-top:0}
.sel-card{border:2px solid;border-radius:12px;padding:12px;margin-bottom:12px}
.sel-card h3{margin:2px 0 6px}.sel-card p{margin:4px 0;font-size:13px}
.report{padding-left:0;list-style:none;margin:0;max-height:360px;overflow:auto}
.report li{padding:6px 10px;border-radius:8px;margin:3px 0;font-size:13px}
.report li.ok{background:var(--ok-soft)}.report li.warn{background:var(--warn-soft)}
.sum{list-style:none;padding:0;margin:0}
.sum li{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
.sum li b{margin-left:auto}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.empty-state{text-align:center;padding:50px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:16px;padding:22px;max-width:520px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:900px}
.modal h3{margin-top:0}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.checklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2px;max-height:50vh;overflow:auto}
#toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:200}
.toast{background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:380px;transition:.4s}
.toast.ok{background:#14532d}.toast.warn{background:#7c2d12}.toast.out{opacity:0;transform:translateY(8px)}
header.top{position:sticky}
.cloud{position:absolute;right:22px;top:20px;font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.12);color:#dbeafe}
.cloud.ok::before{content:'● ';color:#4ade80}.cloud.saving::before{content:'● ';color:#facc15}.cloud.error::before{content:'● ';color:#f87171}.cloud.local::before{content:'● ';color:#94a3b8}
@media (max-width:700px){.cloud{display:none}}
footer{text-align:center;color:var(--muted);font-size:12px;padding:10px}
</style>

<style>
#aulabar{background:#0b1736;color:#dbe4ff;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
#aulabar a{color:#fff;font-weight:700;text-decoration:none}
#aulabar button{background:#fff;color:#1e3a8a;border:0;border-radius:8px;padding:6px 11px;font-weight:700;cursor:pointer;font-size:13px}
#aulabar button.pub{background:#16a34a;color:#fff}
#aulabar button:disabled{opacity:.5}
#aulabar .st{opacity:.85}

<script>
/* Puente entre el generador de horarios y Aula Docente (Supabase) */
(function(){
 const CFG=window.AULA_CONFIG||{};
 if(!window.supabase||!CFG.SUPABASE_URL){return;}
 const sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
 const AULA=window.AULA={sb,uid:null,m:null,inst:null};
 const docShim=(uid,path)=>{const id=String(path).split("/").pop();return{
  async get(){const {data,error}=await sb.from("docs").select("data").eq("user_id",uid).eq("col","horarios").eq("id",id);if(error)throw {code:"unavailable",message:error.message};const r=(data||[])[0];return{exists:!!r,data:()=>r?r.data:undefined};},
  async set(d){const {error}=await sb.from("docs").upsert({user_id:uid,col:"horarios",id,data:d},{onConflict:"user_id,col,id"});if(error)throw {code:/tamano|size/i.test(error.message)?"quota_exceeded":"unavailable",message:error.message};},
  async delete(){await sb.from("docs").delete().eq("user_id",uid).eq("col","horarios").eq("id",id);}};};
 const descarga={async save({filename,data}){const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);return{status:"saved"};}};
 sb.auth.getSession().then(async({data})=>{const s=data.session;
  if(!s||s.user.is_anonymous){location.href="index.html";return;}
  const uid=s.user.id;AULA.uid=uid;
  window.claude={use:async n=>n==="db"?{doc:p=>docShim(uid,p)}:n==="user"?{id:async()=>uid}:n==="downloads"?descarga:null};
  try{const {data:m}=await sb.from("miembros").select("*").eq("user_id",uid);AULA.m=(m||[])[0]||null;
   if(AULA.m){const {data:i}=await sb.from("instituciones").select("*").eq("id",AULA.m.inst_id);AULA.inst=(i||[])[0]||null;}}catch(e){}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",barra);else barra();
 });
 const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
 function barra(){
  const esC=AULA.m&&AULA.m.rol==="coordinador";
  const b=document.createElement("div");b.id="aulabar";
  b.innerHTML=`<a href="index.html#coord">← Coordinación</a><span class="st" id="ab_inst">${AULA.inst?AULA.inst.nombre:"Sin institución"}</span>${esC?`<span style="flex:1"></span><button id="ab_tr">Traer datos de la institución</button><button id="ab_pub" class="pub">Publicar horario a los docentes</button>`:""}<span class="st" id="ab_st"></span>`;
  const h=document.querySelector("header.top");h.parentNode.insertBefore(b,h);
  if(!esC){document.getElementById("ab_st").textContent="Solo coordinación puede traer datos de la institución y publicar el horario.";return;}
  document.getElementById("ab_tr").onclick=traer;document.getElementById("ab_pub").onclick=publicar;
  estadoPub();
 }
 async function estadoPub(){try{const {data}=await sb.from("inst_horario").select("data,updated_at").eq("inst_id",AULA.m.inst_id);const r=(data||[])[0];
  document.getElementById("ab_st").textContent=r&&r.data&&r.data.fecha?"Último publicado: "+new Date(r.data.fecha).toLocaleString("es-CO",{dateStyle:"short",timeStyle:"short"}):"Aún no se ha publicado un horario.";}catch(e){}}
 async function pagina(q){let out=[],from=0;for(;;){const {data,error}=await q().range(from,from+999);if(error)throw error;out=out.concat(data||[]);if(!data||data.length<1000)break;from+=1000;}return out;}
 async function traer(){const bt=document.getElementById("ab_tr");bt.disabled=true;const st=document.getElementById("ab_st");st.textContent="Trayendo datos…";
  try{const i=AULA.m.inst_id;
   const [cur,asi,mie,docs]=await Promise.all([pagina(()=>sb.from("inst_cursos").select("*").eq("inst_id",i).order("id")),pagina(()=>sb.from("inst_asignaturas").select("*").eq("inst_id",i).order("id")),sb.from("miembros").select("*").eq("inst_id",i).then(r=>{if(r.error)throw r.error;return r.data;}),pagina(()=>sb.from("docs").select("user_id,col,id,data").in("col",["asigs","meta"]).order("id"))]);
   const rep={a:0,g:0,d:0,c:0,sinHoras:0};
   if(AULA.inst&&(!state.config.institucion||/^Mi Instituci/.test(state.config.institucion)))state.config.institucion=AULA.inst.nombre;
   const aOf={};for(const a of asi){let x=state.asignaturas.find(s=>s.oficialId===a.id)||state.asignaturas.find(s=>!s.oficialId&&norm(s.nombre)===norm(a.nombre));
    if(!x){x={id:uid("a"),codigo:a.nombre.slice(0,3).toUpperCase(),nombre:a.nombre,area:a.area||"",maxDia:"",bloque:"sencillas",color:nextColor()};state.asignaturas.push(x);rep.a++;}
    x.oficialId=a.id;x.nombre=a.nombre;if(a.area)x.area=a.area;aOf[a.id]=x;}
   const gOf={};for(const c of cur){let x=state.grupos.find(s=>s.oficialId===c.id)||state.grupos.find(s=>!s.oficialId&&norm(s.nombre)===norm(c.nombre));
    if(!x){x={id:uid("g"),nombre:c.nombre,grado:c.grado||"",salonId:"",director:c.director||""};state.grupos.push(x);rep.g++;}
    x.oficialId=c.id;x.nombre=c.nombre;if(c.grado)x.grado=c.grado;gOf[c.id]=x;}
   const metas={};for(const r of docs)if(r.col==="meta")metas[r.user_id]=r.data||{};
   const conCarga=new Set(docs.filter(r=>r.col==="asigs"&&(r.data.cursoIds||[]).length&&aOf[r.id]).map(r=>r.user_id));
   const dU={};for(const m of mie){if(m.rol!=="docente"&&!conCarga.has(m.user_id))continue;const nom=(metas[m.user_id]||{}).docente||m.nombre||m.email||"Docente";
    let x=state.docentes.find(s=>s.userId===m.user_id)||state.docentes.find(s=>!s.userId&&norm(s.nombre)===norm(nom));
    if(!x){x={id:uid("d"),nombre:nom,documento:"",salonId:"",maxDia:"",maxSemana:""};state.docentes.push(x);rep.d++;}
    x.userId=m.user_id;x.nombre=nom;dU[m.user_id]=x;}
   for(const r of docs){if(r.col!=="asigs")continue;const a=aOf[r.id],d=dU[r.user_id];if(!a||!d)continue;
    for(const cid of (r.data.cursoIds||[])){const g=gOf[cid];if(!g)continue;let c=state.carga.find(x=>x.docenteId===d.id&&x.asignaturaId===a.id&&x.grupoId===g.id);
     if(!c){c={id:uid("c"),docenteId:d.id,asignaturaId:a.id,grupoId:g.id,horas:+r.data.horas||"",bloques:"",salonId:""};state.carga.push(c);rep.c++;}
     else if(!c.horas&&+r.data.horas)c.horas=+r.data.horas;
     if(!+c.horas)rep.sinHoras++;}}
   state.horario=state.horario&&state.horario.asig?state.horario:null;
   persist();render();
   st.textContent=`Listo: ${rep.a} asignatura(s), ${rep.g} grupo(s), ${rep.d} docente(s) y ${rep.c} fila(s) de carga nuevas.`+(rep.sinHoras?` ${rep.sinHoras} fila(s) de carga sin horas: complétalas en Datos → Carga.`:"");
  }catch(e){st.textContent="No se pudieron traer los datos: "+(e.message||e);}
  bt.disabled=false;}
 async function publicar(){const st=document.getElementById("ab_st");
  if(!state.horario||!state.horario.asig||!Object.keys(state.horario.asig).length){st.textContent="Primero genera el horario (pestaña Generar).";return;}
  const units=placedUnits();const per=timeline(state.config).filter(r=>r.tipo==="periodo");
  const cg=Object.fromEntries(state.carga.map(c=>[c.id,c])),dd=Object.fromEntries(state.docentes.map(x=>[x.id,x])),aa=Object.fromEntries(state.asignaturas.map(x=>[x.id,x])),gg=Object.fromEntries(state.grupos.map(x=>[x.id,x])),ss=Object.fromEntries(state.salones.map(x=>[x.id,x]));
  const out={};let sin=0,n=0;const sinDoc=new Set();
  for(const u of units){if(u.tipo!=="clase")continue;const c=cg[u.cargaId];if(!c)continue;const d=dd[c.docenteId],a=aa[c.asignaturaId],g=gg[c.grupoId];
   if(!d||!a||!g||!d.userId||!a.oficialId||!g.oficialId){sin++;if(d&&!d.userId)sinDoc.add(d.nombre);continue;}
   const p0=per[u.p],p1=per[u.p+u.len-1];if(!p0||!p1)continue;
   (out[d.userId]=out[d.userId]||[]).push({id:String(u.key).replace(/[^\w-]/g,"_"),dia:u.d+1,inicio:p0.ini,fin:p1.fin,cursoId:g.oficialId,asigId:a.oficialId,aula:(ss[(u.salones||[])[0]]||{}).nombre||""});n++;}
  if(!n){st.textContent="No hay clases vinculadas a docentes de la institución. Usa primero “Traer datos de la institución”.";return;}
  if(!confirm(`Se publicarán ${n} clases para ${Object.keys(out).length} docente(s). Cada docente verá su horario en la vista Semana y reemplazará el que tenga.${sin?` ${sin} clase(s) no se publican porque su docente, curso o asignatura no está en la institución${sinDoc.size?" ("+[...sinDoc].slice(0,5).join(", ")+")":""}.`:""} ¿Publicar?`))return;
  const bt=document.getElementById("ab_pub");bt.disabled=true;
  const {error}=await sb.from("inst_horario").upsert({inst_id:AULA.m.inst_id,data:{fecha:new Date().toISOString(),proyecto:projName(state),docentes:out},updated_at:new Date().toISOString()});
  bt.disabled=false;if(error){st.textContent="No se pudo publicar: "+error.message;return;}
  toast("Horario publicado a los docentes","ok");estadoPub();}
})();
</script>

// Modelo de datos, utilidades, traducción al solver y datos de ejemplo.
const DIAS_BASE = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
let __uidc = 0;
function uid(p) { __uidc++; return (p || 'x') + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 6) + __uidc.toString(36); }
function norm(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }
function normKey(s) { return norm(s).replace(/ /g, ''); }

const PALETA = ['#2563eb', '#16a34a', '#dc2626', '#9333ea', '#ea580c', '#0891b2', '#ca8a04', '#db2777', '#4f46e5', '#059669', '#b45309', '#7c3aed', '#0d9488', '#e11d48', '#65a30d', '#0284c7', '#a21caf', '#c2410c', '#475569', '#15803d'];

function defaultConfig() {
  return {
    institucion: 'Mi Institución Educativa', sede: 'Sede principal', jornada: 'Mañana', anio: String(new Date().getFullYear()), municipio: '',
    dias: DIAS_BASE.map((n, i) => ({ nombre: n, activo: i < 5 })),
    horaInicio: '06:30',
    periodos: [55, 55, 55, 55, 55, 55].map(d => ({ duracion: d })),
    descansos: [{ despuesDe: 3, duracion: 30, nombre: 'Descanso' }],
    permitirBloqueDescanso: false,
    maxDiaDocente: 6, maxSemanaDocente: 22, maxDiaAsignatura: 2,
    tiempo: 30,
    pesos: { tGap: 4, gGap: 10, gLate: 3, split: 6, avoid: 8 },
    salonPrioridad: 'carga-docente-grupo'
  };
}
function emptyState() {
  return { version: 1, config: defaultConfig(), asignaturas: [], docentes: [], grupos: [], salones: [], carga: [], proyectos: [], actividades: [], indisp: { docentes: {}, grupos: {}, asignaturas: {} }, horario: null };
}

function toMin(hhmm) { const m = /^(\d{1,2}):(\d{2})/.exec(String(hhmm || '')); return m ? (+m[1]) * 60 + (+m[2]) : NaN; }
function fmtMin(m) { m = ((m % 1440) + 1440) % 1440; const h = Math.floor(m / 60), mi = m % 60; return String(h).padStart(2, '0') + ':' + String(mi).padStart(2, '0'); }
// Línea de tiempo del día: periodos y descansos
function timeline(cfg) {
  let t = toMin(cfg.horaInicio); if (isNaN(t)) t = 390;
  const rows = [];
  cfg.periodos.forEach((pe, i) => {
    const dur = +pe.duracion || 0;
    rows.push({ tipo: 'periodo', p: i, ini: fmtMin(t), fin: fmtMin(t + dur), iniMin: t, finMin: t + dur });
    t += dur;
    (cfg.descansos || []).filter(b => +b.despuesDe === i + 1).forEach(b => {
      rows.push({ tipo: 'descanso', nombre: b.nombre || 'Descanso', ini: fmtMin(t), fin: fmtMin(t + (+b.duracion || 0)) });
      t += +b.duracion || 0;
    });
  });
  return rows;
}
function activeDays(cfg) { return cfg.dias.map((d, i) => d.activo ? i : -1).filter(i => i >= 0); }

function parseBloques(str, horas) {
  if (str == null || String(str).trim() === '') return null;
  const parts = String(str).split(/[^0-9]+/).filter(Boolean).map(Number).filter(n => n > 0);
  if (!parts.length) return null;
  const sum = parts.reduce((a, b) => a + b, 0);
  if (sum !== +horas) return { error: 'Los bloques (' + str + ') suman ' + sum + ' y las horas son ' + horas, parts };
  return { parts };
}
function defaultBlocks(horas, pref) {
  horas = +horas || 0; const out = [];
  if (pref === 'dobles') { while (horas >= 2) { out.push(2); horas -= 2; } if (horas) out.push(1); }
  else for (let i = 0; i < horas; i++) out.push(1);
  return out;
}

// Construye unidades (bloques a programar) a partir de carga y proyectos
function buildUnits(state) {
  const units = [], issues = [];
  const asigById = Object.fromEntries(state.asignaturas.map(a => [a.id, a]));
  const docById = Object.fromEntries(state.docentes.map(d => [d.id, d]));
  const grpById = Object.fromEntries(state.grupos.map(g => [g.id, g]));
  const salById = Object.fromEntries(state.salones.map(s => [s.id, s]));
  state.carga.forEach(c => {
    const a = asigById[c.asignaturaId], d = docById[c.docenteId], g = grpById[c.grupoId];
    if (!a || !d || !g) { issues.push({ nivel: 'error', msg: 'Fila de carga incompleta (falta ' + [!d && 'docente', !a && 'asignatura', !g && 'grupo'].filter(Boolean).join(', ') + ').' }); return; }
    const h = +c.horas || 0; if (h <= 0) return;
    let parts;
    const pb = parseBloques(c.bloques, h);
    if (pb && pb.error) { issues.push({ nivel: 'error', msg: d.nombre + ' · ' + a.nombre + ' · ' + g.nombre + ': ' + pb.error }); parts = defaultBlocks(h, a.bloque); }
    else parts = pb ? pb.parts : defaultBlocks(h, a.bloque);
    const roomId = (c.salonId && salById[c.salonId]) ? c.salonId : (d.salonId && salById[d.salonId]) ? d.salonId : (g.salonId && salById[g.salonId]) ? g.salonId : '';
    parts.forEach((len, i) => units.push({ key: c.id + '#' + i, tipo: 'clase', len, cargaId: c.id, asignaturaId: a.id, docentes: [d.id], grupos: [g.id], salones: roomId ? [roomId] : [] }));
  });
  state.proyectos.forEach(pr => {
    const h = +pr.horas || 0; if (h <= 0) return;
    const grupos = (pr.grupos || []).filter(id => grpById[id]);
    if (!grupos.length) { issues.push({ nivel: 'error', msg: 'El proyecto "' + pr.nombre + '" no tiene grupos asignados.' }); return; }
    const pb = parseBloques(pr.bloques, h);
    let parts = pb && !pb.error ? pb.parts : defaultBlocks(h, 'sencillas');
    if (pb && pb.error) issues.push({ nivel: 'error', msg: 'Proyecto ' + pr.nombre + ': ' + pb.error });
    const docs = (pr.docentes || []).filter(id => docById[id]);
    const rooms = pr.salonId && salById[pr.salonId] ? [pr.salonId] : [];
    parts.forEach((len, i) => units.push({ key: pr.id + '#' + i, tipo: 'proyecto', len, proyectoId: pr.id, asignaturaId: pr.asignaturaId || '', docentes: docs, grupos, salones: rooms }));
  });
  (state.actividades || []).forEach(ac => {
    const h = Math.max(0, Math.round(+ac.horas || 0)); if (!h) return;
    const docs = (ac.docentes || []).filter(id => docById[id]);
    if (!docs.length) { issues.push({ nivel: 'warn', msg: 'La actividad "' + ac.nombre + '" no tiene docentes asignados.' }); return; }
    const fijo = ac.dia !== '' && ac.dia != null && ac.periodo !== '' && ac.periodo != null ? (+ac.dia) + '-' + (+ac.periodo) : '';
    const len = Math.min(h, state.config.periodos.length);
    if (ac.modalidad === 'individual') docs.forEach(id => units.push({ key: ac.id + '@' + id, tipo: 'actividad', len, actividadId: ac.id, asignaturaId: '', docentes: [id], grupos: [], salones: [], fijo }));
    else units.push({ key: ac.id + '#0', tipo: 'actividad', len, actividadId: ac.id, asignaturaId: '', docentes: docs, grupos: [], salones: [], fijo });
  });

}

// Traduce el estado al formato numérico del solver
function buildSolverInput(state, opts) {
  opts = opts || {};
  const cfg = state.config;
  const days = activeDays(cfg); const D = days.length, P = cfg.periodos.length, S = D * P;
  const { units: U, issues } = buildUnits(state);
  const tIdx = {}, gIdx = {}, rIdx = {}, sIdx = {};
  state.docentes.forEach((d, i) => tIdx[d.id] = i);
  state.grupos.forEach((g, i) => gIdx[g.id] = i);
  state.salones.forEach((r, i) => rIdx[r.id] = i);
  state.asignaturas.forEach((a, i) => sIdx[a.id] = i);
  const slotOf = key => { const [d, p] = key.split('-').map(Number); const di = days.indexOf(d); return di < 0 || p >= P ? -1 : di * P + p; };
  const mkUn = (map) => { const arr = new Array(S).fill(0); (map || []).forEach(k => { const s = slotOf(k); if (s >= 0) arr[s] = 1; }); return arr; };
  const tUn = state.docentes.map(d => mkUn(state.indisp.docentes[d.id]));
  const gUn = state.grupos.map(g => mkUn(state.indisp.grupos[g.id]));
  const sAvoid = state.asignaturas.map(a => mkUn(state.indisp.asignaturas[a.id]));
  const tMaxDay = state.docentes.map(d => +d.maxDia || +cfg.maxDiaDocente || P);
  const sMaxDay = state.asignaturas.map(a => +a.maxDia || +cfg.maxDiaAsignatura || P);
  const breakAfter = new Array(P).fill(false);
  (cfg.descansos || []).forEach(b => { const k = (+b.despuesDe) - 1; if (k >= 0 && k < P) breakAfter[k] = true; });
  const locked = (state.horario && state.horario.locked) || {};
  const prevAsg = (state.horario && state.horario.asig) || {};
  const units = U.map(u => {
    let fixed = -1;
    if (u.fijo) { const s = slotOf(u.fijo); if (s >= 0 && (s % P) + u.len <= P) fixed = s; }
    else if (locked[u.key] && prevAsg[u.key]) { const a = prevAsg[u.key]; const s = slotOf(a.d + '-' + a.p); if (s >= 0) fixed = s; }
    return {
      key: u.key, len: u.len, fixed, noCount: u.tipo === 'actividad',
      teachers: u.docentes.map(id => tIdx[id]).filter(x => x !== undefined),
      groups: u.grupos.map(id => gIdx[id]).filter(x => x !== undefined),
      rooms: u.salones.map(id => rIdx[id]).filter(x => x !== undefined),
      subj: u.asignaturaId && sIdx[u.asignaturaId] !== undefined ? sIdx[u.asignaturaId] : -1
    };
  });
  let starts = null;
  if (opts.useCurrent && state.horario && state.horario.asig) {
    starts = U.map(u => { const a = prevAsg[u.key]; return a ? slotOf(a.d + '-' + a.p) : -1; });
    if (starts.some(s => s < 0)) starts = null;
  }
  const w = cfg.pesos || {};
  return {
    inp: {
      D, P, nT: state.docentes.length, nG: state.grupos.length, nR: state.salones.length, nSub: state.asignaturas.length,
      units, tUn, gUn, sAvoid, tMaxDay, sMaxDay, breakAfter, allowAcrossBreak: !!cfg.permitirBloqueDescanso,
      weights: { tGap: +w.tGap || 0, gGap: +w.gGap || 0, gLate: +w.gLate || 0, split: +w.split || 0, avoid: +w.avoid || 0 },
      seed: opts.seed || (Date.now() & 0x7fffffff), starts
    },
    meta: { days, D, P, units: U, issues }
  };
}

// Motor de horarios: evaluación incremental + recocido simulado.
// Autocontenido: se serializa con toString() para correr en un Web Worker.
function ttEngine(inp, opts) {
  opts = opts || {};
  const D = inp.D, P = inp.P, S = D * P, H = 1000;
  const W = inp.weights;
  const units = inp.units;
  const nT = inp.nT, nG = inp.nG, nR = inp.nR, nSub = inp.nSub;
  let seed = (inp.seed >>> 0) || 123456789;
  function rnd() { seed ^= seed << 13; seed >>>= 0; seed ^= seed >>> 17; seed ^= seed << 5; seed >>>= 0; return seed / 4294967296; }
  function ri(n) { return Math.floor(rnd() * n); }

  const breakAfter = inp.breakAfter || [];
  function validStart(p, len) {
    if (p + len > P) return false;
    if (!inp.allowAcrossBreak) for (let k = p; k < p + len - 1; k++) if (breakAfter[k]) return false;
    return true;
  }
  function slotBlocked(u, s) {
    for (const t of u.teachers) if (inp.tUn[t][s]) return true;
    for (const g of u.groups) if (inp.gUn[g][s]) return true;
    return false;
  }
  const noDomain = [];
  units.forEach((u, i) => {
    u.domain = [];
    if (u.fixed >= 0) { u.domain = [u.fixed]; return; }
    const all = [];
    for (let d = 0; d < D; d++) for (let p = 0; p < P; p++) {
      if (!validStart(p, u.len)) continue;
      const s = d * P + p; all.push(s);
      let ok = true;
      for (let k = 0; k < u.len && ok; k++) if (slotBlocked(u, s + k)) ok = false;
      if (ok) u.domain.push(s);
    }
    if (!u.domain.length) { noDomain.push(i); u.domain = all.length ? all : [0]; }
  });

  // celdas de ocupación
  const tCell = new Array(nT * S), gCell = new Array(nG * S), rCell = new Array(nR * S);
  for (let i = 0; i < tCell.length; i++) tCell[i] = [];
  for (let i = 0; i < gCell.length; i++) gCell[i] = [];
  for (let i = 0; i < rCell.length; i++) rCell[i] = [];
  const start = new Int32Array(units.length).fill(-1);

  function place(ui, s) {
    const u = units[ui]; start[ui] = s;
    for (let k = 0; k < u.len; k++) {
      const c = s + k;
      for (const t of u.teachers) tCell[t * S + c].push(ui);
      for (const g of u.groups) gCell[g * S + c].push(ui);
      for (const r of u.rooms) rCell[r * S + c].push(ui);
    }
  }
  function rm(arr, x) { const i = arr.indexOf(x); if (i >= 0) { arr[i] = arr[arr.length - 1]; arr.pop(); } }
  function unplace(ui) {
    const u = units[ui], s = start[ui]; if (s < 0) return;
    for (let k = 0; k < u.len; k++) {
      const c = s + k;
      for (const t of u.teachers) rm(tCell[t * S + c], ui);
      for (const g of u.groups) rm(gCell[g * S + c], ui);
      for (const r of u.rooms) rm(rCell[r * S + c], ui);
    }
    start[ui] = -1;
  }

  const subCount = new Int32Array(Math.max(1, nSub)), subLast = new Int32Array(Math.max(1, nSub)), subSeg = new Int32Array(Math.max(1, nSub));
  const touched = [];

  function teacherDay(t, d) {
    let clash = 0, occ = 0, first = -1, last = -1;
    const base = t * S + d * P;
    for (let p = 0; p < P; p++) { const cell = tCell[base + p], n = cell.length; if (n) { clash += n - 1; if (first < 0) first = p; last = p; for (let j = 0; j < n; j++) if (!units[cell[j]].noCount) { occ++; break; } } }
    let gaps = 0;
    if (first >= 0) for (let p = first + 1; p < last; p++) if (!tCell[base + p].length && !inp.tUn[t][d * P + p]) gaps++;
    const over = Math.max(0, occ - inp.tMaxDay[t]);
    return clash * H + over * H + gaps * W.tGap;
  }
  function groupDay(g, d) {
    let clash = 0, first = -1, last = -1;
    const base = g * S + d * P;
    touched.length = 0;
    for (let p = 0; p < P; p++) {
      const cell = gCell[base + p], n = cell.length;
      if (n) {
        clash += n - 1; if (first < 0) first = p; last = p;
        for (let j = 0; j < n; j++) {
          const sb = units[cell[j]].subj; if (sb < 0) continue;
          if (subCount[sb] === 0) { touched.push(sb); subSeg[sb] = 0; subLast[sb] = -9; }
          subCount[sb]++;
          if (subLast[sb] !== p - 1 && subLast[sb] !== p) subSeg[sb]++;
          subLast[sb] = p;
        }
      }
    }
    let gaps = 0, late = 0;
    if (first >= 0) {
      for (let p = first + 1; p < last; p++) if (!gCell[base + p].length && !inp.gUn[g][d * P + p]) gaps++;
      for (let p = 0; p < first; p++) if (!inp.gUn[g][d * P + p]) late++;
    }
    let sc = 0;
    for (const sb of touched) {
      const over = subCount[sb] - inp.sMaxDay[sb];
      if (over > 0) sc += over * H;
      if (subSeg[sb] > 1) sc += (subSeg[sb] - 1) * W.split;
      subCount[sb] = 0;
    }
    return clash * H + gaps * W.gGap + late * W.gLate + sc;
  }
  function roomDay(r, d) {
    let clash = 0; const base = r * S + d * P;
    for (let p = 0; p < P; p++) { const n = rCell[base + p].length; if (n > 1) clash += n - 1; }
    return clash * H;
  }
  function unitCost(ui, s) {
    const u = units[ui]; let c = 0;
    for (let k = 0; k < u.len; k++) {
      const x = s + k;
      if (u.subj >= 0 && inp.sAvoid[u.subj][x]) c += W.avoid;
      for (const t of u.teachers) if (inp.tUn[t][x]) c += H;
      for (const g of u.groups) if (inp.gUn[g][x]) c += H;
    }
    if (u.pref && u.pref.length) { /* reservado */ }
    return c;
  }

  // costo local de un conjunto de unidades en un conjunto de días
  const tmpT = [], tmpG = [], tmpR = [], tmpD = [];
  function addU(arr, x) { if (arr.indexOf(x) < 0) arr.push(x); }
  function collect(uis, days) {
    tmpT.length = tmpG.length = tmpR.length = tmpD.length = 0;
    for (const ui of uis) { const u = units[ui]; for (const t of u.teachers) addU(tmpT, t); for (const g of u.groups) addU(tmpG, g); for (const r of u.rooms) addU(tmpR, r); }
    for (const d of days) addU(tmpD, d);
  }
  function localCost() {
    let c = 0;
    for (const d of tmpD) {
      for (const t of tmpT) c += teacherDay(t, d);
      for (const g of tmpG) c += groupDay(g, d);
      for (const r of tmpR) c += roomDay(r, d);
    }
    return c;
  }
  function totalCost() {
    let c = 0;
    for (let d = 0; d < D; d++) {
      for (let t = 0; t < nT; t++) c += teacherDay(t, d);
      for (let g = 0; g < nG; g++) c += groupDay(g, d);
      for (let r = 0; r < nR; r++) c += roomDay(r, d);
    }
    for (let i = 0; i < units.length; i++) if (start[i] >= 0) c += unitCost(i, start[i]);
    return c;
  }

  function greedy() {
    for (let i = 0; i < units.length; i++) if (start[i] >= 0) unplace(i);
    const jit = units.map(() => rnd() * 0.15);
    order.sort((a, b) => {
      const A = units[a], B = units[b];
      if ((A.fixed >= 0) !== (B.fixed >= 0)) return A.fixed >= 0 ? -1 : 1;
      const ka = A.domain.length / (A.len * (A.teachers.length + A.groups.length)) * (1 + jit[a]), kb = B.domain.length / (B.len * (B.teachers.length + B.groups.length)) * (1 + jit[b]);
      return ka - kb;
    });
    for (const ui of order) {
      const u = units[ui];
      if (u.fixed >= 0) { place(ui, u.fixed); continue; }
      let best = 1e18, bestS = [];
      for (const s of u.domain) {
        const d = Math.floor(s / P);
        collect([ui], [d]);
        const before = localCost();
        place(ui, s);
        const after = localCost() + unitCost(ui, s);
        unplace(ui);
        const delta = after - before;
        if (delta < best) { best = delta; bestS = [s]; } else if (delta === best) bestS.push(s);
      }
      place(ui, bestS[ri(bestS.length)]);
    }
  }

  // ---- solución inicial ----
  const init = opts.starts || inp.starts;
  const order = units.map((u, i) => i);
  if (init && init.length === units.length && init.every((s, i) => s >= 0 && units[i].domain.indexOf(s) >= 0 || units[i].fixed >= 0)) {
    for (let i = 0; i < units.length; i++) place(i, units[i].fixed >= 0 ? units[i].fixed : init[i]);
  } else {
    greedy();
  }

  let cost = totalCost();

  function evaluateDetails() {
    const det = { hard: 0, soft: 0, list: [], stats: { tGaps: 0, gGaps: 0, gLate: 0, splits: 0, avoid: 0 } };
    const L = det.list;
    for (let d = 0; d < D; d++) {
      for (let t = 0; t < nT; t++) {
        const base = t * S + d * P; let occ = 0, first = -1, last = -1;
        for (let p = 0; p < P; p++) { const n = tCell[base + p].length; if (n) { if (tCell[base + p].some(x => !units[x].noCount)) occ++; if (first < 0) first = p; last = p; } if (n > 1) { det.hard += n - 1; L.push({ type: 'cruceDocente', t, d, p, units: tCell[base + p].slice() }); } }
        if (occ > inp.tMaxDay[t]) { det.hard += occ - inp.tMaxDay[t]; L.push({ type: 'maxDiaDocente', t, d, n: occ, max: inp.tMaxDay[t] }); }
        if (first >= 0) for (let p = first + 1; p < last; p++) if (!tCell[base + p].length && !inp.tUn[t][d * P + p]) det.stats.tGaps++;
      }
      for (let g = 0; g < nG; g++) {
        const base = g * S + d * P; let first = -1, last = -1; const cnt = {};
        const segs = {}, lastP = {};
        for (let p = 0; p < P; p++) {

    </table>
    <h3>Descansos</h3>
    <table class="tbl compact"><thead><tr><th>Nombre</th><th>Después del periodo</th><th>Duración (min)</th><th></th></tr></thead><tbody>

  </section>
  </div>`;
  const rerender = () => { persist(); viewInstitucion(v); renderNav(); };
  v.onchange = e => {
    const t = e.target;
    if (t.dataset.cfg) { c[t.dataset.cfg] = t.value; persist(); renderNav(); if (t.dataset.cfg === 'horaInicio') rerender(); }

    else if (t.dataset.cfgb) { c[t.dataset.cfgb] = t.checked; persist(); }

    else if (t.id === 'nper') { const n = Math.max(1, Math.min(14, +t.value || 1)); const last = c.periodos.length ? c.periodos[c.periodos.length - 1].duracion : 55; while (c.periodos.length < n) c.periodos.push({ duracion: last }); c.periodos.length = n; rerender(); }
    else if (t.dataset.dur !== undefined) { c.periodos[+t.dataset.dur].duracion = Math.max(5, +t.value || 55); rerender(); }
    else if (t.dataset.brk !== undefined) { const b = c.descansos[+t.dataset.brk]; b[t.dataset.k] = t.dataset.k === 'nombre' ? t.value : (+t.value || 0); rerender(); }
  };
  v.onclick = e => {
    const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); go(g.dataset.go); return; }
    if (e.target.id === 'btn-addbrk') { c.descansos.push({ nombre: 'Descanso', despuesDe: Math.min(c.periodos.length, 3), duracion: 20 }); rerender(); }
    if (e.target.dataset.delbrk !== undefined) { c.descansos.splice(+e.target.dataset.delbrk, 1); rerender(); }
    if (e.target.id === 'btn-durall') { const d = +$('#durall').value; if (d >= 5) { c.periodos.forEach(p => p.duracion = d); rerender(); } }
  };

function areaDocente(d, soloDerivada) {
  if (!soloDerivada && d.area) return d.area;
  const am = byId(state.asignaturas), cnt = {};
  state.carga.filter(c => c.docenteId === d.id).forEach(c => { const a = am[c.asignaturaId]; if (a && a.area) cnt[a.area] = (cnt[a.area] || 0) + (+c.horas || 0); });
  const best = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  return best ? best[0] : '';
}
function gradosDocente(id) { const gm = byId(state.grupos); return [...new Set(state.carga.filter(c => c.docenteId === id).map(c => gm[c.grupoId] && +gm[c.grupoId].grado).filter(x => x || x === 0))]; }
function horasActividades(id) { return (state.actividades || []).filter(a => (a.docentes || []).includes(id)).reduce((s, a) => s + (+a.horas || 0), 0); }
function horasDocente(id) { return state.carga.filter(c => c.docenteId === id).reduce((a, c) => a + (+c.horas || 0), 0) + state.proyectos.filter(p => (p.docentes || []).includes(id)).reduce((a, p) => a + (+p.horas || 0), 0); }
function horasGrupo(id) { return state.carga.filter(c => c.grupoId === id).reduce((a, c) => a + (+c.horas || 0), 0) + state.proyectos.filter(p => (p.grupos || []).includes(id)).reduce((a, p) => a + (+p.horas || 0), 0); }

}

function renderEntity(card, ent) {

    rows = rows.filter(r => (!ui.cargaDoc || r.docenteId === ui.cargaDoc) && (!ui.cargaGrp || r.grupoId === ui.cargaGrp));
    const dmap = byId(state.docentes), gmap = byId(state.grupos);
    rows = rows.slice().sort((a, b) => String((dmap[a.docenteId] || {}).nombre || '').localeCompare(String((dmap[b.docenteId] || {}).nombre || ''), 'es') || String((gmap[a.grupoId] || {}).nombre || '').localeCompare(String((gmap[b.grupoId] || {}).nombre || ''), 'es', { numeric: true }));

    docentes: 'Si el docente tiene salón fijo, los estudiantes se desplazan a ese salón y el sistema evita que dos clases coincidan en él. Las horas de entrada y salida se configuran en Disponibilidad.',
    grupos: 'El salón base se usa cuando el docente no tiene salón fijo. Si un grupo tiene menos horas que franjas disponibles, quedará con horas libres (preferiblemente al final de la jornada).',
    salones: 'Incluya aulas, laboratorios, salas de sistemas, auditorio, canchas u otros espacios compartidos.',
    carga: 'Cada fila indica qué docente dicta qué asignatura a qué grupo y cuántas horas por semana. En "Bloques" puede fijar la distribución (por ejemplo 2,2,1 para cinco horas en dos bloques dobles y una hora suelta).'
  }[ent];
  card.innerHTML = `<div class="row between"><h2>${ENT[ent].titulo}</h2><div class="row gap"><button class="btn sm primary" id="add-row">+ Agregar ${ENT[ent].singular}</button>${state[ent].length ? `<button class="btn sm ghost danger" id="del-all">Borrar todo</button>` : ''}</div></div>
    <p class="hint">${help}</p>${filtros}

    <tbody>${rows.length ? rows.map(r => rowHtml(r, cols)).join('') : `<tr><td colspan="${cols.length + 1}" class="empty">Sin registros. Agregue filas o importe un archivo de Excel.</td></tr>`}</tbody></table></div>`;
  card.onchange = e => {

    if (t.id === 'f-doc') { ui.cargaDoc = t.value; renderEntity(card, ent); return; }
    if (t.id === 'f-grp') { ui.cargaGrp = t.value; renderEntity(card, ent); return; }
    const tr = t.closest('tr[data-id]'); if (!tr || !t.dataset.k) return;
    const row = state[ent].find(r => r.id === tr.dataset.id); if (!row) return;
    let val = t.value; if (t.type === 'number') val = val === '' ? '' : +val;
    row[t.dataset.k] = val;
    if (ent === 'grupos' && t.dataset.k === 'nombre' && !row.grado) { row.grado = inferGrado(val); }
    persist();
    if (t.dataset.k === 'horas' || ent === 'grupos' && t.dataset.k === 'nombre') renderEntity(card, ent);

  card.onclick = async e => {
    if (e.target.id === 'add-row') { state[ent].push(newRow(ent)); persist(); renderEntity(card, ent); updateBadges(); const inp = $$('tbody tr:last-child input, tbody tr:last-child select', card)[ent === 'asignaturas' ? 1 : 0]; if (inp) inp.focus(); return; }

      removeEntity(ent, id); persist(); renderEntity(card, ent); updateBadges();
    }

}
function updateBadges() { $$('.subtab').forEach(b => { const k = b.dataset.ent; const s = b.querySelector('.badge'); if (s && state[k]) s.textContent = state[k].length; }); }
function rowHtml(r, cols) {

function removeEntity(ent, id) {

  if (ent === 'docentes') { state.carga = state.carga.filter(c => c.docenteId !== id); state.proyectos.forEach(p => p.docentes = (p.docentes || []).filter(x => x !== id)); (state.actividades || []).forEach(a => a.docentes = (a.docentes || []).filter(x => x !== id)); delete state.indisp.docentes[id]; state.grupos.forEach(g => { if (g.director === id) g.director = ''; }); }

  if (ent === 'grupos') { state.carga = state.carga.filter(c => c.grupoId !== id); state.proyectos.forEach(p => p.grupos = (p.grupos || []).filter(x => x !== id)); delete state.indisp.grupos[id]; }
  if (ent === 'salones') { state.docentes.forEach(d => { if (d.salonId === id) d.salonId = ''; }); state.grupos.forEach(g => { if (g.salonId === id) g.salonId = ''; }); state.carga.forEach(c => { if (c.salonId === id) c.salonId = ''; }); state.proyectos.forEach(p => { if (p.salonId === id) p.salonId = ''; }); }
}

  salida: ['salida', 'hora salida', 'sale', 'hora de salida', 'hasta', 'retiro', 'sale a'],
  entidad: ['tipo', 'aplica a', 'entidad']

function findCol(headers, key) {
  const syns = SYN[key]; const H = headers.map(norm);
  for (const s of syns) { const i = H.indexOf(s); if (i >= 0) return i; }
  const skip = h => (key !== 'maxdia' && key !== 'maxsemana' && /^(max|maximo|min|minimo|total)\b/.test(h));
  for (const s of syns) { const i = H.findIndex(h => h && !skip(h) && (h.startsWith(s + ' ') || h.endsWith(' ' + s))); if (i >= 0) return i; }

      if (gb.dataset.grado === 'all') state.grupos.forEach(g => s.add(g.id)); else if (gb.dataset.grado === 'none') s.clear();
      else { const all = state.grupos.filter(x => +x.grado === +gb.dataset.grado); const on = all.every(x => s.has(x.id)); all.forEach(x => on ? s.delete(x.id) : s.add(x.id)); }

// ===================== DIAGNÓSTICO =====================
function diagnose() {
  const out = []; const cfg = state.config;
  const days = activeDays(cfg); const P = cfg.periodos.length; const slots = days.length * P;
  if (!days.length) out.push({ nivel: 'error', msg: 'No hay días de clase activos.' });
  if (!state.carga.length && !state.proyectos.length) out.push({ nivel: 'error', msg: 'No hay carga académica registrada.' });
  const { units, issues } = buildUnits(state); issues.forEach(i => out.push(i));
  const unSet = (map, id) => { const s = new Set(); (map[id] || []).forEach(k => { const [d, p] = k.split('-').map(Number); if (days.includes(d) && p < P) s.add(k); }); return s; };
  const tl = timeline(cfg);
  state.grupos.forEach(g => {
    const h = units.filter(u => u.grupos.includes(g.id)).reduce((a, u) => a + u.len, 0); const av = slots - unSet(state.indisp.grupos, g.id).size;
    if (h > av) out.push({ nivel: 'error', msg: `El grupo ${g.nombre} tiene ${h} horas asignadas y solo ${av} franjas disponibles.` });
    else if (h && h < av) out.push({ nivel: 'info', msg: `El grupo ${g.nombre} tiene ${h} horas para ${av} franjas: quedará con ${av - h} hora(s) libre(s).` });
    else if (!h) out.push({ nivel: 'info', msg: `El grupo ${g.nombre} no tiene carga asignada.` });
  });
  state.docentes.forEach(d => {
    const hAll = units.filter(u => u.docentes.includes(d.id)).reduce((a, u) => a + u.len, 0); if (!hAll) return;
    const h = units.filter(u => u.docentes.includes(d.id) && u.tipo !== 'actividad').reduce((a, u) => a + u.len, 0);
    const un = unSet(state.indisp.docentes, d.id); const av = slots - un.size;
    const maxD = +d.maxDia || +cfg.maxDiaDocente;
    let cap = 0; days.forEach(dd => { let free = 0; for (let p = 0; p < P; p++) if (!un.has(dd + '-' + p)) free++; cap += Math.min(free, maxD); });
    if (hAll > av) out.push({ nivel: 'error', msg: `${d.nombre} tiene ${h} horas de clase y ${hAll - h} de otras actividades, pero solo ${av} franjas disponibles.` });
    else if (h > cap) out.push({ nivel: 'error', msg: `${d.nombre} tiene ${h} horas, pero con su disponibilidad y el máximo de ${maxD} horas diarias solo caben ${cap}.` });
    const ms = +d.maxSemana || +cfg.maxSemanaDocente;
    if (ms && h > ms) out.push({ nivel: 'warn', msg: `${d.nombre} tiene ${h} horas semanales (referencia: ${ms}).` });
  });
  // asignatura por día
  const gs = {}; units.forEach(u => { if (!u.asignaturaId) return; u.grupos.forEach(g => { const k = g + '|' + u.asignaturaId; gs[k] = (gs[k] || 0) + u.len; }); });
  const am = byId(state.asignaturas), gm = byId(state.grupos);
  Object.entries(gs).forEach(([k, h]) => { const [g, a] = k.split('|'); const mx = +am[a].maxDia || +cfg.maxDiaAsignatura; if (h > mx * days.length) out.push({ nivel: 'error', msg: `${am[a].nombre} en ${gm[g].nombre}: ${h} horas no caben con máximo ${mx} por día en ${days.length} días.` }); });
  units.forEach(u => { if (u.len > P) out.push({ nivel: 'error', msg: 'Hay un bloque de ' + u.len + ' horas y la jornada solo tiene ' + P + ' periodos.' }); const mx = u.asignaturaId && am[u.asignaturaId] ? (+am[u.asignaturaId].maxDia || +cfg.maxDiaAsignatura) : 99; if (u.len > mx) out.push({ nivel: 'error', msg: `Un bloque de ${u.len} horas de ${am[u.asignaturaId].nombre} supera el máximo de ${mx} horas por día.` }); });
  // salones
  const rh = {}; units.forEach(u => u.salones.forEach(r => rh[r] = (rh[r] || 0) + u.len)); const sm = byId(state.salones);
  Object.entries(rh).forEach(([r, h]) => { if (h > slots) out.push({ nivel: 'error', msg: `El salón ${sm[r].nombre} necesita ${h} horas y la semana tiene ${slots} franjas.` }); });
  // unidades sin franja posible
  const dm = byId(state.docentes);
  units.forEach(u => {
    let any = false;
    for (const d of days) { for (let p = 0; p + u.len <= P && !any; p++) { let ok = true; if (!cfg.permitirBloqueDescanso) for (let k = p; k < p + u.len - 1; k++) if ((cfg.descansos || []).some(b => +b.despuesDe === k + 1)) ok = false; for (let k = 0; k < u.len && ok; k++) { const key = d + '-' + (p + k); if (u.docentes.some(t => (state.indisp.docentes[t] || []).includes(key)) || u.grupos.some(g => (state.indisp.grupos[g] || []).includes(key))) ok = false; } if (ok) any = true; } if (any) break; }
    if (!any) out.push({ nivel: 'error', msg: `No existe ninguna franja posible para un bloque de ${u.len} h (${u.tipo === 'proyecto' ? 'proyecto' : u.tipo === 'actividad' ? ((state.actividades || []).find(a => a.id === u.actividadId) || {}).nombre : (am[u.asignaturaId] || {}).nombre} · ${u.docentes.map(t => (dm[t] || {}).nombre).join(', ')} · ${u.grupos.map(g => (gm[g] || {}).nombre).join(', ')}).` });
  });
  state.docentes.forEach(d => { if (!units.some(u => u.docentes.includes(d.id) && u.tipo !== 'actividad')) out.push({ nivel: 'info', msg: `${d.nombre} no tiene carga asignada.` }); });
  // reuniones conjuntas: ¿existe alguna franja en que todos los participantes puedan estar libres?
  const actById = byId(state.actividades || []);
  units.filter(u => u.tipo === 'actividad' && u.docentes.length > 1).forEach(u => {
    const T = new Set(u.docentes); const ac = actById[u.actividadId] || {};
    const grpFull = state.grupos.filter(g => {
      const gu = units.filter(x => x.grupos.includes(g.id)); if (!gu.length) return false;
      const h = gu.reduce((a, x) => a + x.len, 0); const av = slots - unSet(state.indisp.grupos, g.id).size;
      return h >= av && gu.every(x => x.docentes.some(t => T.has(t)));
    });
    let posibles = 0;
    days.forEach(dd => { for (let p = 0; p + u.len <= P; p++) { let ok = true; for (let k = 0; k < u.len && ok; k++) { const key = dd + '-' + (p + k); if (u.docentes.some(t => (state.indisp.docentes[t] || []).includes(key))) ok = false; if (ok && grpFull.some(g => !(state.indisp.grupos[g.id] || []).includes(key))) ok = false; } if (ok) posibles++; } });
    if (u.fijo) { const [fd, fp] = u.fijo.split('-').map(Number); const bloqueados = u.docentes.filter(t => { for (let k = 0; k < u.len; k++) if ((state.indisp.docentes[t] || []).includes(fd + '-' + (fp + k))) return true; return false; }); if (bloqueados.length) out.push({ nivel: 'error', msg: `"${ac.nombre}" está fijada el ${dayName(fd)} en el periodo ${fp + 1}, pero ${bloqueados.map(t => (dm[t] || {}).nombre).join(', ')} no está(n) disponible(s) en esa franja.` }); }
    else if (!posibles) out.push({ nivel: 'error', msg: `"${ac.nombre}" no tiene franja posible: ${grpFull.length ? 'los grupos ' + grpFull.slice(0, 6).map(g => g.nombre).join(', ') + (grpFull.length > 6 ? '…' : '') + ' tienen la jornada completa y todas sus clases las dictan participantes de la reunión. Bloquee para esos grupos una franja (salida temprana) en Disponibilidad o fije la reunión fuera de la jornada de clase.' : 'no hay una franja en que todos los participantes estén disponibles.'}` });
  });
  return out;
}

  v.innerHTML = `<div class="cols">
  <section class="card">

    <div class="kpis"><div><small>Bloques a programar</small><b>${units.length}</b></div><div><small>Horas de clase</small><b>${units.filter(u => u.tipo !== 'actividad').reduce((a, u) => a + u.len, 0)}</b></div><div><small>Franjas por grupo</small><b>${activeDays(state.config).length * state.config.periodos.length}</b></div><div><small>Bloques fijados</small><b>${locked}</b></div></div>
    <div class="row gap">

    html += `<h3>Resumen</h3><ul class="sum">${Object.entries(cnt).sort((a, b) => a[0].localeCompare(b[0], 'es', { numeric: true })).map(([k, o]) => `<li><span class="dot" style="background:${o.c}"></span>${esc(k)}<b>${o.n} h</b></li>`).join('')}</ul>`;
  }
  box.innerHTML = html;
}
function onCellClick(cell) {
  const key = cell.dataset.key; const [d, p] = cell.dataset.cell.split('-').map(Number);
  if (!ui.sel) { if (key) { ui.sel = key; renderGrid(); renderInfo(); } return; }
  if (key === ui.sel) { ui.sel = null; renderGrid(); renderInfo(); return; }
  if (ui.vista === 'general' && key) { ui.sel = key; renderGrid(); renderInfo(); return; }
  // mover
  const all = placedUnits(); const u = all.find(x => x.key === ui.sel); if (!u) { ui.sel = null; return; }
  const P = state.config.periodos.length;
  let tp = p;
  const target = key ? all.find(x => x.key === key) : null;
  if (target && target.len === u.len) tp = target.p;
  if (tp + u.len > P) { toast('El bloque de ' + u.len + ' horas no cabe desde ese periodo.', 'warn'); return; }
  pushUndo();
  const A = state.horario.asig;
  if (target && target.len === u.len && target.key !== u.key) { const old = { d: u.d, p: u.p }; A[u.key] = { d: target.d, p: target.p }; A[target.key] = old; }
  else A[u.key] = { d, p: tp };
  if ((state.horario.locked || {})[u.key]) state.horario.locked[u.key] = true;
  persist(); ui.evalCache = null;
  const ev = currentEval();
  if (ev.conflictKeys.has(u.key)) toast('Movida, pero genera conflicto. Puede deshacer.', 'warn');
  ui.sel = null; viewHorarios($('#view'));
}
function onInfoAction(a) {
  if (a === 'desel') { ui.sel = null; renderGrid(); renderInfo(); }
  if (a === 'lock') { pushUndo(); const L = state.horario.locked = state.horario.locked || {}; if (L[ui.sel]) delete L[ui.sel]; else L[ui.sel] = true; persist(); viewHorarios($('#view')); }
}

// ---------- Exportar horario a Excel ----------
function exportHorarioXlsx() {
  const ev = currentEval(); if (!ev) return;
  const cfg = state.config; const days = activeDays(cfg); const tl = timeline(cfg); const all = placedUnits();
  const dm = byId(state.docentes), gm = byId(state.grupos), sm = byId(state.salones);
  const hdr = v => ({ v, b: true, fill: '#1e3a8a', color: '#ffffff', border: true, center: true, wrap: true });
  const sheets = [];
  const titleRows = (t, sub, ncol) => [[{ v: cfg.institucion, b: true, size: 14 }], [{ v: [cfg.sede, cfg.jornada && 'Jornada ' + cfg.jornada.toLowerCase(), cfg.anio].filter(Boolean).join(' · ') }], [{ v: t, b: true, size: 12 }], [{ v: sub || '' }]];
  function personal(name, title, sub, us, vista) {
    const rows = titleRows(title, sub, days.length + 1); rows.push([hdr('Hora')].concat(days.map(d => hdr(dayName(d)))));
    const at = {}; us.forEach(u => { for (let k = 0; k < u.len; k++) at[u.d + '-' + (u.p + k)] = u; });
    const heights = {};
    tl.forEach(r => {
      if (r.tipo === 'descanso') { rows.push([{ v: r.ini + ' - ' + r.fin, fill: '#e5e7eb', border: true, center: true }].concat(days.map(() => ({ v: r.nombre, fill: '#e5e7eb', border: true, center: true })))); return; }
      heights[rows.length] = 42;
      rows.push([{ v: (r.p + 1) + '\n' + r.ini + ' - ' + r.fin, b: true, border: true, center: true, wrap: true }].concat(days.map(d => { const u = at[d + '-' + r.p]; if (!u) return { v: '', border: true }; const lb = unitLabel(u); const c = cellContent(u, vista); return { v: c.t + (c.s ? '\n' + c.s : ''), fill: tint(lb.color, .28), border: true, wrap: true, center: true }; })));
    });
    sheets.push({ name, rows, cols: [14].concat(days.map(() => 24)), heights });
  }
  // General
  const grupos = sortGroups(state.grupos);
  const at = {}; all.forEach(u => { for (let k = 0; k < u.len; k++) u.grupos.forEach(g => at[g + '|' + u.d + '|' + (u.p + k)] = u); });
  const grows = titleRows('Horario general por grupos', '', grupos.length + 3); grows.push([hdr('Día'), hdr('Periodo'), hdr('Hora')].concat(grupos.map(g => hdr(g.nombre))));
  const per = tl.filter(r => r.tipo === 'periodo');
  days.forEach(d => per.forEach(r => grows.push([{ v: dayName(d), b: true, border: true }, { v: r.p + 1, border: true, center: true }, { v: r.ini + '-' + r.fin, border: true }].concat(grupos.map(g => { const u = at[g.id + '|' + d + '|' + r.p]; if (!u) return { v: '', border: true }; const lb = unitLabel(u); return { v: lb.codigo + ' ' + u.docentes.map(id => shortName((dm[id] || {}).nombre)).join('/'), fill: tint(lb.color, .28), border: true, wrap: true }; })))));
  sheets.push({ name: 'General', rows: grows, cols: [12, 8, 12].concat(grupos.map(() => 18)), freeze: 'D6' });
  grupos.forEach(g => { const dir = dm[g.director]; personal('G ' + g.nombre, 'Horario del grupo ' + g.nombre, [dir && 'Director(a) de grupo: ' + dir.nombre, sm[g.salonId] && 'Salón: ' + sm[g.salonId].nombre].filter(Boolean).join(' · '), all.filter(u => u.grupos.includes(g.id)), 'grupo'); });
  sortByName(state.docentes).forEach(d => { const us = all.filter(u => u.docentes.includes(d.id)); if (!us.length) return; const ha = us.filter(u => u.tipo === 'actividad').reduce((a, u) => a + u.len, 0); personal(shortName(d.nombre), 'Horario de ' + d.nombre, us.reduce((a, u) => a + u.len, 0) - ha + ' horas de clase' + (ha ? ' + ' + ha + ' de otras actividades' : '') + (sm[d.salonId] ? ' · Salón: ' + sm[d.salonId].nombre : ''), us, 'docente'); });
  const used = state.salones.filter(s => all.some(u => u.salones.includes(s.id)) && all.some(u => u.salones.includes(s.id) && state.grupos.find(g => g.id === u.grupos[0] && g.salonId !== s.id)));
  used.forEach(s => personal('S ' + s.nombre, 'Ocupación del salón ' + s.nombre, '', all.filter(u => u.salones.includes(s.id)), 'salon'));
  // Carga
  const carga = [[hdr('Docente'), hdr('Horas de clase'), hdr('Otras actividades'), hdr('Huecos en la semana')]];
  sortByName(state.docentes).forEach(d => { const us = all.filter(u => u.docentes.includes(d.id)); const ha = us.filter(u => u.tipo === 'actividad').reduce((a, u) => a + u.len, 0); let gaps = 0; days.forEach(dd => { const occ = new Set(); us.filter(u => u.d === dd).forEach(u => { for (let k = 0; k < u.len; k++) occ.add(u.p + k); }); if (occ.size) { const mn = Math.min(...occ), mx = Math.max(...occ); for (let p = mn; p <= mx; p++) if (!occ.has(p)) gaps++; } }); carga.push([{ v: d.nombre, border: true }, { v: us.reduce((a, u) => a + u.len, 0) - ha, border: true }, { v: ha, border: true }, { v: gaps, border: true }]); });
  sheets.push({ name: 'Resumen docentes', rows: carga, cols: [40, 16, 18, 20] });
  if (ev.msgs.length) sheets.push({ name: 'Conflictos', rows: [[hdr('Conflicto')]].concat(ev.msgs.map(m => [m])), cols: [100] });
  saveFile(fileBase() + '_horarios.xlsx', XL.write(sheets));
}

// ===================== ARRANQUE =====================
function init() {
  const h = location.hash.slice(1); if (TABS.some(t => t[0] === h)) ui.tab = h;
  $('#nav').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); };
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h) && h !== ui.tab) { ui.tab = h; render(); } });
  $('#brand').onclick = () => go('inicio');
  render();
  let tries = 0;
  setCloud('local');
  const hook = () => {
    if (window.claude && typeof window.claude.use === 'function') { window.claude.use('downloads').then(d => { downloads = d; }).catch(() => { }); initCloud(window.claude); return; }
    if (++tries < 40) setTimeout(hook, 250);
  };
  hook();
}
document.addEventListener('DOMContentLoaded', init);

</script>
