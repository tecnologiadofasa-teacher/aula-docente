<style>

<div id="app">
  <header class="top">
    <div class="brand"><b>Aula Docente</b><span class="sp"></span><span id="who"></span><a id="gear" href="#ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></a></div>
    <div class="ctx" id="ctx"></div>

<script>
"use strict";
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uuid=()=>crypto.randomUUID?crypto.randomUUID():"10000000-1000-4000-8000-100000000000".replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,"0");
const hoy=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
const fFecha=f=>{if(!f)return"";const[y,m,d]=f.split("-");return `${d}/${m}/${y}`;};
const byName=(a,b)=>String(a.nombre||"").localeCompare(String(b.nombre||""),"es",{numeric:true});
const nomEst=e=>e?`${e.apellidos||""} ${e.nombres||""}`.trim():"";
function lsGet(k){try{return JSON.parse(localStorage.getItem("aula_"+k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem("aula_"+k,JSON.stringify(v));}catch(e){}}
function toast(m,err){const d=document.createElement("div");d.textContent=m;if(err)d.className="e";$("#toast").appendChild(d);setTimeout(()=>d.remove(),err?6000:2600);}
function dbMsg(e){const c=e&&String(e.code||""),m=String((e&&e.message)||"");
 if(c==="42P01"||/relation .*docs.* does not exist|Could not find the table/i.test(m))return"Falta crear la tabla en Supabase: ejecuta el archivo supabase/schema.sql.";
 if(c==="42501"||/row-level security|permission denied/i.test(m))return"Supabase rechazó la operación por permisos. Revisa las políticas de schema.sql.";
 if(/JWT|expired|refresh token/i.test(m))return"Tu sesión expiró. Vuelve a ingresar.";
 if(/Failed to fetch|NetworkError|Load failed/i.test(m))return"Sin conexión con el servidor. Revisa tu internet e inténtalo de nuevo.";
 return"No se pudo guardar"+(m?": "+m.slice(0,140):". Inténtalo de nuevo.");}

/* ---------- estado ---------- */
const CFG=window.AULA_CONFIG||{};
let sb=null,session=null,uid=null,ready=false;const downloads=true;
const driveOn=()=>!!CFG.GOOGLE_CLIENT_ID;
const S={cfg:null,cursos:{},asigs:{},ests:{},acts:{},notas:{},asis:{},evid:{}};
const COL={cursos:"cursos",asigs:"asignaturas",ests:"estudiantes",acts:"actividades",notas:"notas",asis:"asistencia",evid:"evidencias"};
const loaded=new Set();let loadWarn="",loadErr="";
const ctx=lsGet("ctx")||{};
const UI={sel:new Set(),selMode:false,visibles:[],view:"inicio",q:"",fecha:hoy(),cursoFiltro:null,evPer:"per",showComp:false};
let dirty=false;

async function dbSet(col,id,data){const {error}=await sb.from("docs").upsert({user_id:uid,col,id,data,updated_at:new Date().toISOString()},{onConflict:"user_id,col,id"});if(error)throw error;}
async function dbDel(col,id){const {error}=await sb.from("docs").delete().eq("user_id",uid).eq("col",col).eq("id",id);if(error)throw error;}
const wq={};
function pend(col,id){const q=wq[col+"/"+id];return q&&(q.t||q.busy);}
function queueSave(col,id,delay=700){const k=col+"/"+id;const q=wq[k]||(wq[k]={t:null,busy:false,again:false});clearTimeout(q.t);q.t=setTimeout(()=>{q.t=null;flush(col,id);},delay);}
async function flush(col,id){const k=col+"/"+id,q=wq[k];if(q.busy){q.again=true;return;}q.busy=true;
 try{const d=S[col][id];if(d)await dbSet(col,id,strip(d));else await dbDel(col,id);guardarCache();}catch(e){toast(dbMsg(e),true);}
 q.busy=false;if(q.again){q.again=false;flush(col,id);}}
function strip(o){const c={...o};delete c.id;return c;}
async function put(col,obj){S[col][obj.id]=obj;sched();await dbSet(col,obj.id,strip(obj));guardarCache();}
async function del(col,id){delete S[col][id];sched();await dbDel(col,id);guardarCache();}
let cfgChain=Promise.resolve();
function saveCfg(patch){const next={...cfg(),...patch};S.cfg=next;sched();cfgChain=cfgChain.then(()=>dbSet("config","config",next)).then(()=>{guardarCache();if(INST.m)return syncMeta();}).catch(e=>{toast(dbMsg(e),true);});return cfgChain;}

/* ---------- cálculo ---------- */
const num=v=>{if(v===""||v==null)return null;const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null;};
const dec=()=>{const d=+cfg().escala.dec;return isFinite(d)?d:1;};
const rnd=n=>{const f=Math.pow(10,dec());return Math.round(n*f+1e-9)/f;};
const fmt=n=>n==null?"—":rnd(n).toFixed(dec());
const comps=a=>(a&&a.componentes&&a.componentes.length)?a.componentes:[{id:"gen",nombre:"General",peso:100}];
const estsCurso=cid=>Object.values(S.ests).filter(e=>e.cursoId===cid&&e.activo!==false).sort((a,b)=>nomEst(a).localeCompare(nomEst(b),"es"));
const actsDe=(cid,aid,pid)=>Object.values(S.acts).filter(x=>x.cursoId===cid&&x.asigId===aid&&(!pid||x.perId===pid)).sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")||(a.creado||0)-(b.creado||0));
const notaAct=(aid,eid)=>num(((S.notas[aid]||{}).n||{})[eid]);
function promComp(eid,acts,cid){let s=0,w=0;for(const x of acts)if(x.compId===cid){const v=notaAct(x.id,eid);if(v!=null){const p=+x.peso||1;s+=v*p;w+=p;}}return w?s/w:null;}
function notaPer(eid,cid,aid,pid){const acts=actsDe(cid,aid,pid);let s=0,w=0;for(const c of comps(S.asigs[aid])){const m=promComp(eid,acts,c.id);if(m!=null){s+=m*(+c.peso||0);w+=(+c.peso||0);}}return w?s/w:null;}
function notaAcum(eid,cid,aid){let s=0,w=0;for(const p of cfg().periodos){const n=notaPer(eid,cid,aid,p.id);if(n!=null){s+=n*(+p.peso||0);w+=(+p.peso||0);}}return w?s/w:null;}
function desemp(n){if(n==null)return"";const r=rnd(n);const d=(cfg().escala.desempenos||[]).find(d=>r>=+d.desde-1e-9&&r<=+d.hasta+1e-9);return d?d.nombre:"";}
const DESCOL=["#c0392b","#d68910","#2e86c1","#1e8449","#7d3c98","#117a65"];
function niveles(){return (cfg().escala.desempenos||[]).map((d,i)=>({...d,color:/^#[0-9a-f]{6}$/i.test(d.color||"")?d.color:DESCOL[i%DESCOL.length]})).sort((a,b)=>+a.desde-+b.desde);}
function nivelDe(n){if(n==null)return null;const r=rnd(n);return niveles().find(d=>r>=+d.desde-1e-9&&r<=+d.hasta+1e-9)||null;}
const tinte=n=>{const d=nivelDe(n);return d?`background:${d.color}26;`:"";};
const desTag=n=>{const d=nivelDe(n);return d?`<span class="dtag"><i style="background:${d.color}"></i>${esc(d.nombre)}</span>`:"";};
const aprueba=n=>n==null?null:rnd(n)>=+cfg().escala.aprob;
const codTipo=c=>((cfg().codigos.find(x=>x.c===c))||{}).tipo||"registro";
const asisKey=(cid,aid,f)=>`${cid}__${aid}__${f}`;
const marcasCfg=()=>Array.isArray(cfg().marcas)?cfg().marcas:_def.marcas;
function resMarcas(eid,cid,aid,pid){const r={};for(const d of Object.values(S.asis)){if(d.cursoId!==cid||d.asigId!==aid||(pid&&d.perId!==pid))continue;const m=(d.extra||{})[eid];if(m)r[m]=(r[m]||0)+1;}return r;}
function resAsis(eid,cid,aid,pid){const r={ses:0,falta:0,just:0,tarde:0};for(const d of Object.values(S.asis)){if(d.cursoId!==cid||d.asigId!==aid||(pid&&d.perId!==pid))continue;const c=(d.reg||{})[eid];if(!c)continue;r.ses++;const t=tipoReg(d,eid);if(t==="falta")r.falta++;else if(t==="justificada")r.just++;else if(t==="tarde")r.tarde++;}r.pct=r.ses?Math.round(100*(r.ses-r.falta-r.just)/r.ses):null;return r;}

  <div class="stat"><div class="v">${ns?fmt(sp/ns):"—"}</div><div class="l">Promedio del periodo</div></div>
  <div class="stat"><div class="v">${na?Math.round(sa/na)+"%":"—"}</div><div class="l">Asistencia promedio</div></div>
  <div class="stat"><div class="v">${nev}</div><div class="l">Evidencias del periodo</div></div></div>
  ${instEv?`<div class="banner i row"><span class="sp">Instala Aula Docente en este dispositivo para abrirla desde su propio ícono.</span><button class="btn sm pri" data-go="instalar">Instalar</button></div>`:""}<div class="row" style="margin-bottom:12px"><a class="btn pri" href="#asistencia">Tomar asistencia</a><button class="btn" data-go="act">Nueva actividad</button><button class="btn" data-go="ev">Subir evidencia</button>${modoOficial()?"":`<button class="btn" data-go="est">Registrar estudiante</button>`}</div>
  <div class="card"><h3>Seguimiento</h3>${riesgo.length?`<div class="list">${riesgo.map(([e,m])=>`<div class="it" data-est="${e.id}" style="cursor:pointer">${av(e,"s")}<div class="nm"><b>${esc(nomEst(e))}</b></div>${m.map(x=>`<span class="tag bad">${esc(x)}</span>`).join(" ")}</div>`).join("")}</div>`:`<div class="mut sm">Sin estudiantes por debajo de la nota aprobatoria (${esc(c.escala.aprob)}) ni con ${esc(c.alertaFallas)} o más fallas en este periodo.</div>`}</div>`;
 }
 h+=`<div class="card"><h3>Seguridad y privacidad</h3><div class="sm mut">Ingresas con tu cuenta de Google o con correo y contraseña. La base de datos aplica seguridad por filas: cada docente solo puede leer y modificar sus propios registros, aunque varias personas usen la misma aplicación. Las evidencias se guardan en tu Google Drive con los permisos que tú definas allí. Recuerda contar con la autorización de los acudientes para el tratamiento de datos e imagen de menores (Ley 1581 de 2012).</div></div>`;

async function purgeEsts(ids){const set=new Set(ids);
 for(const id of ids)await del("ests",id);
 try{await sb.from("matriculas").delete().eq("teacher_id",uid).in("est_id",ids);}catch(e){}AV.loaded=false;
 for(const d of Object.values(S.notas)){const n=d.n||{};if(Object.keys(n).some(k=>set.has(k))){const nn={};for(const k in n)if(!set.has(k))nn[k]=n[k];await put("notas",{...d,n:nn});}}
 for(const d of Object.values(S.asis)){const r=d.reg||{};if(Object.keys(r).some(k=>set.has(k))){const rr={};for(const k in r)if(!set.has(k))rr[k]=r[k];await put("asis",{...d,reg:rr});}}
 for(const v of Object.values(S.evid)){if((v.estIds||[]).some(k=>set.has(k)))await put("evid",{...v,estIds:v.estIds.filter(k=>!set.has(k))});}}
function askTyped(msg,palabra){return new Promise(res=>{$("#cfs").innerHTML=`<div style="font-size:15px;margin-bottom:10px">${esc(msg)}</div><label class="f">Escribe <b>${esc(palabra)}</b> para confirmar<input type="text" id="cf_t" autocomplete="off"></label><div class="ft"><button class="btn" id="cf_n">Cancelar</button><button class="btn dan" id="cf_y" disabled>Eliminar</button></div>`;$("#cf").classList.remove("hidden");
 const done=v=>{$("#cf").classList.add("hidden");res(v);};$("#cf_t").oninput=e=>{$("#cf_y").disabled=e.target.value.trim().toUpperCase()!==palabra;};$("#cf_n").onclick=()=>done(false);$("#cf_y").onclick=()=>done(true);setTimeout(()=>$("#cf_t").focus(),50);});}
async function bulk(op){const ids=[...UI.sel].filter(id=>S.ests[id]);if(!ids.length)return;
 if(op==="bDel"){if(!await askTyped(`Vas a eliminar ${ids.length} estudiante(s) con sus fotografías, notas, asistencias y su vínculo con las evidencias. No se puede deshacer; si solo dejaron de asistir, usa “Marcar como retirados”.`,"ELIMINAR"))return;
  toast("Eliminando…");try{await purgeEsts(ids);UI.sel.clear();toast(ids.length+" estudiante(s) eliminado(s)");}catch(e){toast(dbMsg(e),true);}renderMain();return;}

 const act=op==="bReact";if(!await ask(`¿${act?"Reactivar a":"Marcar como retirados a"} ${ids.length} estudiante(s)?${act?"":" Dejan de aparecer en listas, notas y asistencia; su historial se conserva."}`,act?"Reactivar":"Retirar"))return;
 try{for(const id of ids)await put("ests",{...S.ests[id],activo:act});if(!act){await sb.from("matriculas").delete().eq("teacher_id",uid).in("est_id",ids);AV.loaded=false;}UI.sel.clear();toast("Listo");}catch(e){toast(dbMsg(e),true);}renderMain();}

async function resizeImg(file,size=200){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const s=Math.min(img.width,img.height);const sx=(img.width-s)/2,sy=(img.height-s)*0.3;const c=document.createElement("canvas");c.width=c.height=size;c.getContext("2d").drawImage(img,sx,sy,s,s,0,0,size,size);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.72));};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"));};img.src=url;});}

 return new Promise((res,rej)=>{const tc=google.accounts.oauth2.initTokenClient({client_id:CFG.GOOGLE_CLIENT_ID,scope:"https://www.googleapis.com/auth/drive.file",login_hint:(session&&session.user&&session.user.email)||undefined,
  callback:r=>{if(r.error)return rej({code:"auth",message:r.error_description||r.error});driveTok=r.access_token;driveExp=Date.now()+(+r.expires_in||3600)*1000;res(driveTok);},
  error_callback:e=>rej({code:e&&e.type==="popup_closed"?"closed":"popup",message:e&&e.message})});tc.requestAccessToken({prompt:""});});}
function driveErr(e){const c=e&&e.code;
 if(c==="noconf")return"Google Drive no está configurado en esta instalación (GOOGLE_CLIENT_ID en config.js). Puedes guardar enlaces.";
 if(c==="nogis")return"No se cargó el servicio de Google. Revisa tu conexión y recarga la página.";
 if(c==="closed")return"Se cerró la ventana de Google antes de dar el permiso.";
 if(c==="popup")return"El navegador bloqueó la ventana de Google. Permite ventanas emergentes para este sitio e inténtalo de nuevo.";
 if(c==="auth")return"Google no concedió el permiso para Drive"+(e.message?": "+e.message:".");
 if(e&&e.status===404)return"No se encontró la carpeta en Drive. En Ajustes usa “Olvidar carpetas” y vuelve a intentarlo.";
 if(e&&(e.status===403||e.status===429))return"Google Drive rechazó la operación (permiso o cuota)"+(e.message?": "+e.message:".");
 if(c==="no_id")return e.message;
 return"No se pudo usar Google Drive"+(e&&e.message?": "+String(e.message).slice(0,160):". Revisa tu conexión.");}
async function gapi(url,opts={},retry=true){const tok=await driveToken();const r=await fetch(url,{...opts,headers:{...(opts.headers||{}),Authorization:"Bearer "+tok}});
 if(r.status===401&&retry){driveTok=null;return gapi(url,opts,false);}
 if(!r.ok){let m="";try{const j=await r.json();m=(j.error&&j.error.message)||"";}catch(x){}throw{code:"http",status:r.status,message:m};}
 return r;}
async function crearCarpeta(name,parent){const r=await gapi("https://www.googleapis.com/drive/v3/files?fields=id",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,mimeType:"application/vnd.google-apps.folder",...(parent?{parents:[parent]}:{})})});
 const j=await r.json();if(!j.id)throw{code:"no_id",message:"Google Drive no devolvió el identificador de la carpeta."};return j.id;}
async function carpeta(cid,aid){
 const d=cfg().drive||{rootId:"",carpetas:{}};let root=d.rootId;
 if(!root){root=await crearCarpeta("Aula Docente - Evidencias "+(cfg().anio||""));await saveCfg({drive:{...d,rootId:root,carpetas:{}}});}
 const k=cid+"_"+aid;let f=((cfg().drive||{}).carpetas||{})[k];
 if(!f){f=await crearCarpeta(`${(S.cursos[cid]||{}).nombre||"Curso"} - ${(S.asigs[aid]||{}).nombre||"Asignatura"}`,root);const d2=cfg().drive;await saveCfg({drive:{...d2,carpetas:{...(d2.carpetas||{}),[k]:f}}});}
 return f;}
async function subir(file,folder){const type=file.type||"application/octet-stream";const nombre=file.name||"evidencia";const meta={name:nombre,parents:[folder]};let j;
 if(file.size<=5*1024*1024){const fd=new FormData();fd.append("metadata",new Blob([JSON.stringify(meta)],{type:"application/json"}));fd.append("file",file);
  j=await (await gapi("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink",{method:"POST",body:fd})).json();}
 else{const ini=await gapi("https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,name,webViewLink",{method:"POST",headers:{"Content-Type":"application/json; charset=UTF-8","X-Upload-Content-Type":type},body:JSON.stringify(meta)});
  const loc=ini.headers.get("Location");if(!loc)throw{code:"http",message:"Drive no entregó la dirección de carga para el archivo grande."};
  const r=await fetch(loc,{method:"PUT",headers:{"Content-Type":type},body:file});if(!r.ok)throw{code:"http",status:r.status,message:"La carga del archivo falló."};j=await r.json();}
 return{nombre,mime:type,size:file.size,driveId:j.id||"",link:j.webViewLink||(j.id?`https://drive.google.com/file/d/${j.id}/view`:"")};}

/* ---------- exportaciones ---------- */
const csvC=v=>{const s=String(v??"");return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
const csv=rows=>"﻿"+rows.map(r=>r.map(csvC).join(";")).join("\r\n");
const slug=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"");
function bajar(filename,data){try{const blob=new Blob([data],{type:/\.csv$/.test(filename)?"text/csv;charset=utf-8":"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}catch(e){toast("No se pudo descargar el archivo.",true);}}
function csvNotas(){const cur=S.cursos[ctx.c],as=S.asigs[ctx.a],per=cfg().periodos.find(p=>p.id===ctx.p);const acts=actsDe(cur.id,as.id,per.id);const cs=comps(as);
 const rows=[["Documento","Apellidos","Nombres",...acts.map(a=>a.nombre+" ("+((cs.find(c=>c.id===a.compId)||{}).nombre||"")+")"),...cs.map(c=>"Prom. "+c.nombre+" "+c.peso+"%"),"Definitiva "+per.nombre,"Desempeño","Acumulado año"]];
 for(const e of estsCurso(cur.id)){const n=notaPer(e.id,cur.id,as.id,per.id),ac=notaAcum(e.id,cur.id,as.id);rows.push([e.documento||"",e.apellidos||"",e.nombres||"",...acts.map(a=>{const v=notaAct(a.id,e.id);return v==null?"":fmt(v).replace(".",",");}),...cs.map(c=>{const m=promComp(e.id,acts,c.id);return m==null?"":fmt(m).replace(".",",");}),n==null?"":fmt(n).replace(".",","),desemp(n),ac==null?"":fmt(ac).replace(".",",")]);}
 bajar(`Notas_${slug(cur.nombre)}_${slug(as.nombre)}_${slug(per.nombre)}.csv`,csv(rows));}
function csvAsis(){const cur=S.cursos[ctx.c],as=S.asigs[ctx.a],per=cfg().periodos.find(p=>p.id===ctx.p);const ds=Object.values(S.asis).filter(x=>x.cursoId===cur.id&&x.asigId===as.id&&x.perId===per.id).sort((a,b)=>a.fecha.localeCompare(b.fecha));
 const rows=[["Documento","Apellidos","Nombres",...ds.map(d=>fFecha(d.fecha)),"Clases","Fallas","Justificadas","Tardes","% asistencia",...marcasCfg().map(m=>m.nombre)]];
 for(const e of estsCurso(cur.id)){const r=resAsis(e.id,cur.id,as.id,per.id);const rm=resMarcas(e.id,cur.id,as.id,per.id);rows.push([e.documento||"",e.apellidos||"",e.nombres||"",...ds.map(d=>[(d.reg||{})[e.id],(d.extra||{})[e.id]].filter(Boolean).join("+")),r.ses,r.falta,r.just,r.tarde,r.pct==null?"":r.pct,...marcasCfg().map(m=>rm[m.c]||0)]);}
 bajar(`Asistencia_${slug(cur.nombre)}_${slug(as.nombre)}_${slug(per.nombre)}.csv`,csv(rows));}
function backup(){const o={app:"aula-docente",version:1,fecha:new Date().toISOString(),cfg:cfg()};for(const k of Object.keys(COL))o[k]=Object.values(S[k]);bajar(`Aula_Docente_copia_${hoy()}.json`,JSON.stringify(o));}
async function restaurar(file){let o;try{o=JSON.parse(await file.text());}catch(e){return toast("El archivo no es una copia válida.",true);}
 if(!o||o.app!=="aula-docente")return toast("El archivo no corresponde a una copia de Aula Docente.",true);
 const tot=Object.keys(COL).reduce((s,k)=>s+((o[k]||[]).length),0);
 if(!await ask(`La copia tiene ${tot} registros. Se agregarán o reemplazarán los registros con el mismo identificador; los demás se conservan. ¿Restaurar?`,"Restaurar"))return;
 toast("Restaurando…");let n=0;try{if(o.cfg)await saveCfg(o.cfg);for(const k of Object.keys(COL))for(const d of (o[k]||[])){if(d&&typeof d.id==="string"&&/^[\w\-.~:@+]+$/.test(d.id)){await put(k,d);n++;}}toast(`Copia restaurada: ${n} registros.`);}catch(e){toast(dbMsg(e)+` Se restauraron ${n}.`,true);}}

function estadisticas(){

 const filas=[];for(const cid of cursos)for(const e of estsCurso(cid)){const n=UI.stAlc==="per"?notaPer(e.id,cid,as.id,per.id):notaAcum(e.id,cid,as.id);filas.push({e,cid,n});}
 const con=filas.filter(f=>f.n!=null),sin=filas.length-con.length,niv=niveles();

 const fuera=con.filter(f=>!nivelDe(f.n)).length;
 const vals=con.map(f=>rnd(f.n)).sort((a,b)=>a-b);const prom=vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:null;
 const med=vals.length?(vals.length%2?vals[(vals.length-1)/2]:(vals[vals.length/2-1]+vals[vals.length/2])/2):null;
 const apr=con.filter(f=>aprueba(f.n)).length;
 const titulo=`${as.nombre} · ${UI.stGrp==="curso"?cur.nombre:"todos los cursos"} · ${UI.stAlc==="per"?per.nombre:"acumulado del año"}`;
 const svg=pieSVG(cuenta.map(c=>({nombre:c.d.nombre,color:c.d.color,v:c.ests.length,rango:`${c.d.desde}–${c.d.hasta}`})),con.length,titulo);
 openModal(`<div class="hd"><h3>Estadísticas</h3><button class="x" data-close>×</button></div>
 <div class="row" style="margin-bottom:10px"><div class="seg"><button data-stalc="per" class="${UI.stAlc==="per"?"on":""}">${esc(per.nombre)}</button><button data-stalc="acu" class="${UI.stAlc==="acu"?"on":""}">Acumulado del año</button></div>
 ${(as.cursoIds||[]).length>1?`<div class="seg"><button data-stgrp="curso" class="${UI.stGrp==="curso"?"on":""}">${esc(cur.nombre)}</button><button data-stgrp="todos" class="${UI.stGrp==="todos"?"on":""}">Todos los cursos</button></div>`:""}</div>
 ${con.length?`<div id="st_svg">${svg}</div>
 <div class="stt"><div><b>${fmt(prom)}</b><span>Promedio</span></div><div><b>${fmt(med)}</b><span>Mediana</span></div><div><b>${fmt(vals[vals.length-1])}</b><span>Nota más alta</span></div><div><b>${fmt(vals[0])}</b><span>Nota más baja</span></div><div><b>${Math.round(100*apr/con.length)}%</b><span>Aprueban (${apr} de ${con.length})</span></div>${sin?`<div><b>${sin}</b><span>Sin nota</span></div>`:""}</div>
 <table class="g" style="width:100%;margin-bottom:10px"><thead><tr><th style="text-align:left">Desempeño</th><th>Rango</th><th>Estudiantes</th><th>%</th></tr></thead><tbody>${cuenta.map(c=>`<tr><td style="text-align:left"><span class="dtag"><i style="background:${c.d.color}"></i>${esc(c.d.nombre)}</span></td><td>${esc(c.d.desde)}–${esc(c.d.hasta)}</td><td>${c.ests.length}</td><td>${Math.round(1000*c.ests.length/con.length)/10}%</td></tr>`).join("")}</tbody></table>
 ${fuera?`<div class="banner">${fuera} nota(s) quedan fuera de los rangos de desempeño. Revisa la escala en Ajustes.</div>`:""}

 <div class="ft"><button class="btn" id="st_png">Descargar imagen</button></div>`:`<div class="empty">Todavía no hay notas para calcular estadísticas en este ${UI.stAlc==="per"?"periodo":"año"}.</div>`}`,sh=>{

  const pb=$("#st_png",sh);if(pb)pb.onclick=()=>svgPNG($("#st_svg svg"),`Estadisticas_${slug(titulo)}.png`);
 });

function pieSVG(datos,total,titulo){
 const W=560,H=300,cx=150,cy=165,r=112;let a0=-Math.PI/2,sl="";
 const nz=datos.filter(d=>d.v>0);
 for(const d of datos){if(!d.v)continue;const pct=Math.round(1000*d.v/total)/10;const tip=`<title>${esc(d.nombre)}: ${d.v} estudiante(s), ${pct}%</title>`;
  if(nz.length===1){sl+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${d.color}">${tip}</circle>`;break;}
  const a1=a0+2*Math.PI*d.v/total;const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
  sl+=`<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${d.color}" stroke="#fff" stroke-width="2" stroke-linejoin="round">${tip}</path>`;
  const am=(a0+a1)/2;if(d.v/total>=0.06)sl+=`<text x="${(cx+r*0.64*Math.cos(am)).toFixed(1)}" y="${(cy+r*0.64*Math.sin(am)).toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#fff" pointer-events="none">${Math.round(100*d.v/total)}%</text>`;
  a0=a1;}
 const ley=datos.map((d,i)=>{const y=96+i*30;return `<rect x="300" y="${y-9}" width="14" height="14" rx="3" fill="${d.color}"/><text x="322" y="${y}" font-size="14" fill="#1b2630" dominant-baseline="central">${esc(d.nombre)} <tspan fill="#5b6872" font-size="12">(${esc(d.rango)})</tspan></text><text x="${W-14}" y="${y}" font-size="14" fill="#1b2630" text-anchor="end" dominant-baseline="central" font-weight="700">${d.v} · ${Math.round(1000*d.v/total)/10}%</text>`;}).join("");
 return `<svg class="pie" viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Distribución por nivel de desempeño" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" style="max-width:${W}px;display:block;margin:0 auto">
 <rect width="${W}" height="${H}" fill="#fff"/><text x="14" y="24" font-size="15" font-weight="700" fill="#1b2630">Distribución por nivel de desempeño</text><text x="14" y="44" font-size="12" fill="#5b6872">${esc(titulo)} · ${total} estudiante(s) con nota</text>${sl}${ley}</svg>`;
}
function svgPNG(svg,nombre){if(!svg)return;const xml=new XMLSerializer().serializeToString(svg);const img=new Image();const vb=svg.viewBox.baseVal;const k=2;
 img.onload=()=>{const c=document.createElement("canvas");c.width=vb.width*k;c.height=vb.height*k;const g=c.getContext("2d");g.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{if(!b)return toast("No se pudo generar la imagen.",true);const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);},"image/png");};
 img.onerror=()=>toast("No se pudo generar la imagen.",true);img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(xml);}

/* ---------- INFORMES DE ASISTENCIA ---------- */
function asisFiltro(o){return Object.values(S.asis).filter(d=>(!o.cursoId||d.cursoId===o.cursoId)&&(!o.asigId||d.asigId===o.asigId)&&(o.perId?d.perId===o.perId:true)&&(!o.desde||d.fecha>=o.desde)&&(!o.hasta||d.fecha<=o.hasta)&&S.cursos[d.cursoId]);}
function resumenEst(eid,docs){const r={ses:0,falta:0,just:0,tarde:0,m:{}};for(const d of docs){const c=(d.reg||{})[eid];const x=(d.extra||{})[eid];if(x)r.m[x]=(r.m[x]||0)+1;if(!c)continue;r.ses++;const t=tipoReg(d,eid);if(t==="falta")r.falta++;else if(t==="justificada")r.just++;else if(t==="tarde")r.tarde++;}r.pct=r.ses?Math.round(100*(r.ses-r.falta-r.just)/r.ses):null;return r;}

 <div class="seg" style="margin-bottom:10px"><button data-cm="per" class="${F.modo==="per"?"on":""}">Por periodo</button><button data-cm="rango" class="${F.modo==="rango"?"on":""}">Entre fechas</button></div>
 ${F.modo==="per"?`<label class="f">Periodo<select id="cn_p">${cfg().periodos.map(p=>`<option value="${p.id}" ${p.id===F.per?"selected":""}>${esc(p.nombre)}</option>`).join("")}</select></label>`:`<div class="f2"><label class="f">Desde<input type="date" id="cn_d" value="${esc(F.desde)}"></label><label class="f">Hasta<input type="date" id="cn_h" value="${esc(F.hasta)}"></label></div><div class="row" style="margin:-4px 0 10px"><button class="btn sm" id="cn_hoy">Inicio del periodo a hoy</button></div>`}

  case"exUno":{const cl=clDe(el.dataset.k);return cl?formExcusaMasiva([cl]):null;}
  case"exMasiva":return formExcusaMasiva([...CO.exSel].map(clDe).filter(Boolean));
  case"exNinguno":CO.exSel=new Set();return renderMain();
  case"exColectiva":return formExcusaCurso();
  case"exSelCur":{const b=faltasDia(CO.exF).find(x=>x.cu.n===el.dataset.k);if(!b)return;const ks=b.lista.map(r=>keyCl(r.cl));const todos=ks.every(k=>CO.exSel.has(k));ks.forEach(k=>todos?CO.exSel.delete(k):CO.exSel.add(k));return renderMain();}

  case"csvCons":{const {pe,cs,marcas}=CO._cons;const rows=[["Curso","Estudiante","Clases","Fallas","Justificadas","Tardes","% asistencia","Días sin asistir",...marcas]];
   for(const cu of cs)for(const cl of cu.est){const x=pe.get(cl);if(!x)continue;rows.push([cu.nombre,cl.nombre,x.ses,x.falta,x.just,x.tarde,x.pct==null?"":x.pct,x.diasAus,...marcas.map(m=>x.marcas[m]||0)]);}
   return bajar(`Consolidado_institucional_${CO.desde}_${CO.hasta}.csv`,csv(rows));}
  case"copInv":{const i=INST.inst||{};return copiar(el.dataset.t==="d"?`Únete a ${i.nombre} en Aula Docente para que coordinación pueda consultar la asistencia de tus clases:\n1. Abre ${appURL()} e ingresa con tu cuenta.\n2. Ve a Ajustes → Institución.\n3. Escribe el código ${i.codigo_docentes}.`:i.codigo_coord);}
  case"regen":{if(!await ask("Se generarán códigos nuevos. Los miembros actuales siguen dentro; los códigos anteriores dejan de servir. ¿Continuar?","Cambiar"))return;const nc=()=>nuevoCod();const {error}=await sb.from("instituciones").update({codigo_docentes:nc(),codigo_coord:nc()}).eq("id",INST.m.inst_id);if(error)return toast(avErr(error),true);await loadInst();return renderMain();}
  case"params":{const P=(INST.inst||{}).params||{};openModal(`<div class="hd"><h3>Parámetros de alertas</h3><button class="x" data-close>×</button></div><p class="sm mut">Según el SIEE de la institución. Los porcentajes se calculan sobre las clases registradas en el periodo.</p>

  case"quitarM":{const m=CO.miembros.find(x=>x.user_id===el.dataset.id);if(!await ask(`¿Quitar a ${m.nombre||m.email} de la institución? Coordinación dejará de ver su asistencia.`,"Quitar",true))return;const {error}=await sb.from("miembros").delete().eq("inst_id",INST.m.inst_id).eq("user_id",m.user_id);if(error)return toast(avErr(error),true);return loadCoord(r[0],r[1],true);}

const OF={cursos:[],asigs:[],ests:[],at:0,cargando:false};
const modoOficial=()=>!!(INST.m&&OF.cursos.length);
const gradoDe=n=>{const s=String(n||"").trim();let m=s.match(/^(\d{1,2})(\d{2})$/);if(m)return String(+m[1]);m=s.match(/^(\d{1,2})/);return m?String(+m[1]):"";};
const ordCur=(a,b)=>String(a.nombre).localeCompare(String(b.nombre),"es",{numeric:true});
async function loadOficial(forzar){if(!INST.m||OF.cargando)return;if(!forzar&&Date.now()-OF.at<600000)return;OF.cargando=true;
 try{const i=INST.m.inst_id;const [c,a,e]=await Promise.all([pag(()=>sb.from("inst_cursos").select("*").eq("inst_id",i).order("id")),pag(()=>sb.from("inst_asignaturas").select("*").eq("inst_id",i).order("id")),pag(()=>sb.from("inst_estudiantes").select("*").eq("inst_id",i).order("id"))]);
  OF.cursos=c.sort(ordCur);OF.asigs=a.sort(byName);OF.ests=e;OF.at=Date.now();}catch(e){}
 OF.cargando=false;}
async function putMany(col,objs){if(!objs.length)return;for(const o of objs)S[col][o.id]=o;sched();
 for(let i=0;i<objs.length;i+=200){const rows=objs.slice(i,i+200).map(o=>({user_id:uid,col,id:o.id,data:strip(o),updated_at:new Date().toISOString()}));const {error}=await sb.from("docs").upsert(rows,{onConflict:"user_id,col,id"});if(error)throw error;}guardarCache();}
const igual=(a,b)=>String(a??"")===String(b??"");
async function syncOficial(){if(!modoOficial())return;
 const offC=Object.fromEntries(OF.cursos.map(c=>[c.id,c])),offA=Object.fromEntries(OF.asigs.map(a=>[a.id,a])),offE=Object.fromEntries(OF.ests.map(e=>[e.id,e]));
 const cur=[],asg=[],est=[];
 for(const c of Object.values(S.cursos)){const o=offC[c.id];if(o&&!(igual(c.nombre,o.nombre)&&igual(c.grado,o.grado)&&igual(c.jornada,o.jornada)&&igual(c.director,o.director)))cur.push({...c,nombre:o.nombre,grado:o.grado,jornada:o.jornada,director:o.director,oficial:true});}
 for(const a of Object.values(S.asigs)){const o=offA[a.id];if(o&&!igual(a.nombre,o.nombre))asg.push({...a,nombre:o.nombre,oficial:true});}
 const mis=new Set(Object.values(S.asigs).flatMap(a=>(offA[a.id]?a.cursoIds:[])||[]).filter(id=>offC[id]));
 for(const o of OF.ests){const l=S.ests[o.id];const act=!!o.activo&&mis.has(o.curso_id);
  const b={apellidos:o.apellidos,nombres:o.nombres,tipoDoc:o.tipo_doc,documento:o.documento,acudiente:o.acudiente,telefono:o.telefono,correo:o.correo,cursoId:o.curso_id};
  if(!l){if(act)est.push({id:o.id,...b,activo:true,oficial:true,creado:Date.now()});continue;}
  if(Object.keys(b).some(k=>!igual(l[k],b[k]))||(l.activo!==false)!==act||!l.oficial)est.push({...l,...b,activo:act,oficial:true});}
 for(const l of Object.values(S.ests))if(l.oficial&&!offE[l.id]&&l.activo!==false)est.push({...l,activo:false});
 try{await putMany("cursos",cur);await putMany("asigs",asg);await putMany("ests",est);}catch(e){toast(dbMsg(e),true);}}
function formCarga(){
 if(!OF.cursos.length)return toast("Coordinación aún no ha subido los cursos oficiales.",true);
 if(!OF.asigs.length)return toast("Coordinación aún no ha registrado el catálogo de asignaturas.",true);
 const sel={};for(const a of OF.asigs){const l=S.asigs[a.id];sel[a.id]=new Set(l?(l.cursoIds||[]).filter(id=>OF.cursos.some(c=>c.id===id)):[]);}
 const grados=[...new Set(OF.cursos.map(c=>c.grado||gradoDe(c.nombre)))].sort((a,b)=>String(a).localeCompare(String(b),"es",{numeric:true}));
 const abiertas=new Set(Object.keys(sel).filter(k=>sel[k].size));
 const cuerpo=()=>OF.asigs.map(a=>{const on=abiertas.has(a.id);return `<div class="slot"><label class="chk" style="margin:0"><input type="checkbox" data-ca="${esc(a.id)}" ${on?"checked":""}><span><b>${esc(a.nombre)}</b>${a.area?` <span class="mut sm">${esc(a.area)}</span>`:""}${sel[a.id].size?` <span class="tag ok">${sel[a.id].size} curso(s)</span>`:""}</span></label>
  ${on?grados.map(g=>{const cs=OF.cursos.filter(c=>(c.grado||gradoDe(c.nombre))===g);return `<div class="row" style="gap:4px;margin-top:8px;align-items:center"><span class="mut sm" style="width:64px">${g?"Grado "+esc(g):"Otros"}</span>${cs.map(c=>`<button class="mb ${sel[a.id].has(c.id)?"on":""}" data-ta="${esc(a.id)}" data-tc="${esc(c.id)}">${esc(c.nombre)}</button>`).join("")}<button class="lnk sm" data-tg="${esc(a.id)}" data-g="${esc(g)}">todo el grado</button></div>`;}).join(""):""}</div>`;}).join("");
 openModal(`<div class="hd"><h3>Mi carga académica</h3><button class="x" data-close>×</button></div><p class="sm mut">Marca las asignaturas que dictas y, en cada una, los cursos. Los estudiantes aparecen automáticamente desde las listas oficiales de coordinación.</p><div id="cg">${cuerpo()}</div><div class="ft"><button class="btn pri" id="cg_ok">Guardar carga</button></div>`,sh=>{
  const pinta=()=>{$("#cg").innerHTML=cuerpo();};
  sh.addEventListener("change",e=>{const a=e.target.dataset.ca;if(!a)return;if(e.target.checked)abiertas.add(a);else{abiertas.delete(a);sel[a].clear();}pinta();});
  sh.addEventListener("click",e=>{const d=e.target.dataset;if(d.ta){const s=sel[d.ta];s.has(d.tc)?s.delete(d.tc):s.add(d.tc);pinta();}else if(d.tg){const cs=OF.cursos.filter(c=>(c.grado||gradoDe(c.nombre))===d.g);const s=sel[d.tg];const todos=cs.every(c=>s.has(c.id));cs.forEach(c=>todos?s.delete(c.id):s.add(c.id));pinta();}});
  $("#cg_ok",sh).onclick=async ev=>{ev.target.disabled=true;const asg=[],nec=new Set();
   for(const a of OF.asigs){const ids=[...sel[a.id]];const l=S.asigs[a.id];
    if(ids.length){ids.forEach(i=>nec.add(i));asg.push(l?{...l,nombre:a.nombre,cursoIds:ids,oficial:true}:{id:a.id,nombre:a.nombre,horas:"",cursoIds:ids,componentes:(cfg().plantilla||_def.plantilla).map(c=>({...c})),oficial:true,creado:Date.now()});}
    else if(l&&(l.cursoIds||[]).length)asg.push({...l,cursoIds:[]});}
   const cur=[...nec].filter(i=>!S.cursos[i]).map(i=>{const c=OF.cursos.find(x=>x.id===i);return{id:i,nombre:c.nombre,grado:c.grado||gradoDe(c.nombre),jornada:c.jornada,director:c.director,oficial:true};});
   try{await putMany("cursos",cur);await putMany("asigs",asg);await syncOficial();closeModal();fixCtx();toast("Carga académica guardada");render();}catch(e){ev.target.disabled=false;toast(dbMsg(e),true);}};
 });}

   $("#io_ok").disabled=!out.length;};
  $("#io_t",sh).oninput=parse;

 <label class="f">Motivo<input type="text" id="em_m" placeholder="Ej.: cita médica, calamidad doméstica, salida pedagógica" list="em_ml"><datalist id="em_ml"><option>Cita médica</option><option>Enfermedad</option><option>Calamidad doméstica</option><option>Salida pedagógica</option><option>Actividad institucional</option><option>Representación del colegio</option></datalist></label>
 <label class="f">Enlace al soporte (opcional)<input type="url" id="em_s" placeholder="https://drive.google.com/…"></label>
 <label class="chk"><input type="checkbox" id="em_ap" checked><span>Aprobar de inmediato (las faltas quedan justificadas en todas las asignaturas)</span></label>
 <div class="ft"><button class="btn pri" id="em_ok">Guardar ${cls.length>1?cls.length+" excusas":"excusa"}</button></div>`,sh=>{
  $("#em_ok",sh).onclick=async ev=>{const d=$("#em_d").value,hh=$("#em_h").value||d;if(!d||hh<d)return toast("Revisa las fechas.",true);ev.target.disabled=true;
   const comun={inst_id:INST.m.inst_id,desde:d,hasta:hh,motivo:$("#em_m").value.trim(),soporte:$("#em_s").value.trim(),estado:$("#em_ap").checked?"aprobada":"pendiente"};
   const rows=cls.map(c=>({...comun,curso:c.curso,est_key:c.k,est_doc:c.d||"",est_id:c.id||"",est_nombre:c.nombre}));
   for(let i=0;i<rows.length;i+=300){const {error}=await sb.from("excusas").insert(rows.slice(i,i+300));if(error){ev.target.disabled=false;return toast(avErr(error),true);}}
   CO.exSel=new Set();closeModal();toast(rows.length===1?"Excusa registrada":rows.length+" excusas registradas");await loadCoord(CO.rango[0],CO.rango[1],true);};});}
function formExcusaCurso(){const cs=cursosCo();if(!cs.length)return toast("No hay cursos.",true);
 openModal(`<div class="hd"><h3>Excusa para un curso completo</h3><button class="x" data-close>×</button></div><p class="sm mut">Útil para salidas pedagógicas, actividades institucionales o representaciones del colegio. Se registra una excusa para cada estudiante activo del curso.</p>
 <label class="f">Curso<select id="ec_c">${cs.map(c=>`<option value="${esc(c.n)}">${esc(c.nombre)} (${c.est.length})</option>`).join("")}</select></label><div class="ft"><button class="btn pri" id="ec_ok">Continuar</button></div>`,sh=>{
  $("#ec_ok",sh).onclick=()=>{const cu=CO.cursos[$("#ec_c").value];if(!cu||!cu.est.length)return toast("El curso no tiene estudiantes.",true);formExcusaMasiva(cu.est,`Excusa para el curso ${cu.nombre} (${cu.est.length} estudiantes)`);};});}

/* ---------- UNIFICAR CON LA LISTA OFICIAL ---------- */
const locales=()=>({c:Object.values(S.cursos).filter(c=>!c.oficial&&!OF.cursos.some(o=>o.id===c.id)),a:Object.values(S.asigs).filter(a=>!a.oficial&&!OF.asigs.some(o=>o.id===a.id)),e:Object.values(S.ests).filter(e=>!e.oficial)});
const hayDuplicados=()=>modoOficial()&&(locales().e.length>0||locales().c.length>0);
function planUnificar(selA){const L=locales();const mapC={},mapA={},mapE={},sinE=[];
 for(const c of L.c){const o=OF.cursos.find(x=>norm(x.nombre)===norm(c.nombre));if(o)mapC[c.id]=o.id;}
 for(const a of L.a){const v=selA&&selA[a.id]!==undefined?selA[a.id]:((OF.asigs.find(x=>norm(x.nombre)===norm(a.nombre))||{}).id||"");if(v)mapA[a.id]=v;}
 for(const e of L.e){const cid=mapC[e.cursoId]||e.cursoId;const d=digits(e.documento),k=norm((e.apellidos||"")+" "+(e.nombres||""));
  const o=OF.ests.find(x=>(d&&digits(x.documento)===d))||OF.ests.find(x=>x.curso_id===cid&&norm(x.apellidos+" "+x.nombres)===k);if(o)mapE[e.id]=o.id;else sinE.push(e);}
 return{L,mapC,mapA,mapE,sinE};}
function formUnificar(){
 if(!modoOficial())return;const selA={};
 const pinta=()=>{const P=planUnificar(selA);const nE=Object.keys(P.mapE).length;
  return `<p class="sm mut">Encontré datos que registraste antes de que coordinación subiera la lista oficial. Al unificar, cada estudiante se cambia por su registro oficial y conserva sus notas, asistencia, evidencias y foto. Los cursos y asignaturas repetidos también se unifican.</p>
  <h3>Cursos</h3>${P.L.c.length?P.L.c.map(c=>`<div class="sm">${esc(c.nombre)} → ${P.mapC[c.id]?`<b>${esc(OF.cursos.find(o=>o.id===P.mapC[c.id]).nombre)}</b> (oficial)`:`<span style="color:var(--warn)">no existe en la lista oficial; se elimina</span>`}</div>`).join(""):'<div class="sm mut">Sin cursos repetidos.</div>'}
  <h3 style="margin-top:10px">Asignaturas</h3>${P.L.a.length?P.L.a.map(a=>`<label class="f" style="margin-bottom:6px">${esc(a.nombre)} se une con<select data-ua="${esc(a.id)}"><option value="">Mantenerla aparte</option>${OF.asigs.map(o=>`<option value="${esc(o.id)}" ${P.mapA[a.id]===o.id?"selected":""}>${esc(o.nombre)}</option>`).join("")}</select></label>`).join(""):'<div class="sm mut">Sin asignaturas repetidas.</div>'}
  <h3 style="margin-top:10px">Estudiantes</h3><div class="sm"><b>${nE}</b> se unifican con la lista oficial.</div>
  ${P.sinE.length?`<div class="banner" style="margin-top:6px"><b>${P.sinE.length}</b> no están en la lista oficial y se eliminarán: ${P.sinE.slice(0,40).map(e=>esc(nomEst(e))).join(", ")}${P.sinE.length>40?"…":""}. Si alguno debería estar, pídele a coordinación que lo agregue antes de unificar.</div>`:""}
  <div class="prog" id="un_p"></div>`;};
 openModal(`<div class="hd"><h3>Unificar con la lista oficial</h3><button class="x" data-close>×</button></div><div id="un_b">${pinta()}</div><div class="ft"><button class="btn pri" id="un_ok">Unificar</button></div>`,sh=>{
  sh.addEventListener("change",e=>{const a=e.target.dataset.ua;if(a!==undefined){selA[a]=e.target.value;$("#un_b").innerHTML=pinta();}});
  $("#un_ok",sh).onclick=async ev=>{const P=planUnificar(selA);
   if(P.sinE.length&&!await ask(`Se eliminarán ${P.sinE.length} estudiante(s) que no están en la lista oficial, con sus notas y asistencia. Los demás conservan todo su historial. ¿Continuar?`,"Unificar",true))return;
   ev.target.disabled=true;try{await aplicarUnificar(P,m=>{$("#un_p").textContent=m;});closeModal();toast("Listo: estudiantes unificados con la lista oficial");render();}catch(e){ev.target.disabled=false;toast(dbMsg(e),true);}};});}
async function delMany(col,ids){ids=[...new Set(ids)];if(!ids.length)return;for(const id of ids)delete S[col][id];sched();
 for(let i=0;i<ids.length;i+=200){const {error}=await sb.from("docs").delete().eq("user_id",uid).eq("col",col).in("id",ids.slice(i,i+200));if(error)throw error;}guardarCache();}
async function aplicarUnificar(P,log){const {mapC,mapA,mapE}=P;const fuera=new Set(P.sinE.map(e=>e.id));const mc=id=>mapC[id]||id,ma=id=>mapA[id]||id,me=id=>mapE[id]||id;
 log("Unificando cursos y asignaturas…");
 const curNuevos=[...new Set(Object.values(mapC))].filter(id=>!S.cursos[id]).map(id=>{const o=OF.cursos.find(x=>x.id===id);return{id,nombre:o.nombre,grado:o.grado||gradoDe(o.nombre),jornada:o.jornada,director:o.director,oficial:true};});
 await putMany("cursos",curNuevos);
 const asg=[],asgDel=[];
 for(const a of P.L.a){const cIds=(a.cursoIds||[]).map(mc);
  if(mapA[a.id]){const nid2=mapA[a.id],t=S.asigs[nid2],o=OF.asigs.find(x=>x.id===nid2);const tieneActs=Object.values(S.acts).some(x=>x.asigId===nid2);
   asg.push({...(t||{id:nid2,horas:a.horas||"",creado:Date.now()}),nombre:o.nombre,oficial:true,componentes:(!t||!tieneActs)?(a.componentes||comps(a)):t.componentes,cursoIds:[...new Set([...((t&&t.cursoIds)||[]),...cIds])]});asgDel.push(a.id);}
  else asg.push({...a,cursoIds:[...new Set(cIds)]});}
 const yaA=new Set(asg.map(x=>x.id));for(const a of Object.values(S.asigs))if(!yaA.has(a.id)&&(a.cursoIds||[]).some(i=>mapC[i]))asg.push({...a,cursoIds:[...new Set(a.cursoIds.map(mc))]});
 await putMany("asigs",asg);await delMany("asigs",asgDel);
 log("Trasladando estudiantes…");
 const est=[];for(const [vie,nue] of Object.entries(mapE)){const v=S.ests[vie],l=S.ests[nue],o=OF.ests.find(x=>x.id===nue);
  const base=l||{id:nue,apellidos:o.apellidos,nombres:o.nombres,tipoDoc:o.tipo_doc,documento:o.documento,acudiente:o.acudiente,telefono:o.telefono,correo:o.correo,cursoId:o.curso_id,activo:!!o.activo,oficial:true,creado:Date.now()};
  est.push({...base,foto:base.foto||v.foto||"",obs:[base.obs,v.obs].filter(Boolean).join("\n"),autorizacion:!!(base.autorizacion||v.autorizacion),nacimiento:base.nacimiento||v.nacimiento||""});}
 await putMany("ests",est);
 log("Trasladando notas, asistencia y evidencias…");
 const acts=Object.values(S.acts).filter(x=>mapC[x.cursoId]||mapA[x.asigId]).map(x=>({...x,cursoId:mc(x.cursoId),asigId:ma(x.asigId)}));await putMany("acts",acts);
 const notas=[];for(const d of Object.values(S.notas)){const n=d.n||{};if(!Object.keys(n).some(k=>mapE[k]||fuera.has(k)))continue;const nn={};for(const [k,v] of Object.entries(n))if(!mapE[k]&&!fuera.has(k))nn[k]=v;for(const [k,v] of Object.entries(n))if(mapE[k]&&nn[mapE[k]]==null)nn[mapE[k]]=v;notas.push({...d,n:nn});}
 await putMany("notas",notas);
 const asisN={},asisDel=[];for(const d of Object.values(S.asis)){const tocar=mapC[d.cursoId]||mapA[d.asigId]||Object.keys({...(d.reg||{}),...(d.extra||{})}).some(k=>mapE[k]||fuera.has(k));if(!tocar)continue;
  const c2=mc(d.cursoId),a2=ma(d.asigId),k2=asisKey(c2,a2,d.fecha);const dest=asisN[k2]||(S.asis[k2]&&k2!==d.id?{...S.asis[k2],reg:{...(S.asis[k2].reg||{})},extra:{...(S.asis[k2].extra||{})}}:{...d,id:k2,cursoId:c2,asigId:a2,reg:{},extra:{}});
  if(k2===d.id){for(const k of Object.keys(dest.reg))if(mapE[k]||fuera.has(k))delete dest.reg[k];for(const k of Object.keys(dest.extra))if(mapE[k]||fuera.has(k))delete dest.extra[k];}for(const [k,v] of Object.entries(d.reg||{}))if(!fuera.has(k)&&dest.reg[me(k)]==null)dest.reg[me(k)]=v;for(const [k,v] of Object.entries(d.extra||{}))if(!fuera.has(k)&&dest.extra[me(k)]==null)dest.extra[me(k)]=v;
  if(!dest.tema&&d.tema)dest.tema=d.tema;if(!dest.obs&&d.obs)dest.obs=d.obs;asisN[k2]=dest;if(k2!==d.id)asisDel.push(d.id);}
 await putMany("asis",Object.values(asisN));await delMany("asis",asisDel.filter(id=>!asisN[id]));
 const ev=Object.values(S.evid).filter(v=>mapC[v.cursoId]||mapA[v.asigId]||(v.estIds||[]).some(k=>mapE[k])).map(v=>({...v,cursoId:mc(v.cursoId),asigId:ma(v.asigId),estIds:[...new Set((v.estIds||[]).map(me))]}));await putMany("evid",ev);
 if((cfg().horario||[]).some(s=>mapC[s.cursoId]||mapA[s.asigId]))await saveCfg({horario:cfg().horario.map(s=>({...s,cursoId:mc(s.cursoId),asigId:ma(s.asigId)}))});
 try{const {data:cods}=await sb.from("codigos").select("*").eq("teacher_id",uid);for(const c of (cods||[]))if(mapC[c.curso_id]||mapA[c.asig_id])await sb.from("codigos").update({curso_id:mc(c.curso_id),asig_id:ma(c.asig_id)}).eq("id",c.id);
  const {data:ms}=await sb.from("matriculas").select("*").eq("teacher_id",uid);for(const m of (ms||[]))if(mapC[m.curso_id]||mapA[m.asig_id]||mapE[m.est_id])await sb.from("matriculas").update({curso_id:mc(m.curso_id),asig_id:ma(m.asig_id),est_id:me(m.est_id)}).eq("id",m.id);
  const {data:ps}=await sb.from("publicaciones").select("id,clases,est_ids").eq("teacher_id",uid);for(const p of (ps||[])){const cl=(p.clases||[]).map(k=>{const [c,a]=k.split("|");return mc(c)+"|"+ma(a);}),es=(p.est_ids||[]).map(me);if(JSON.stringify(cl)!==JSON.stringify(p.clases)||JSON.stringify(es)!==JSON.stringify(p.est_ids))await sb.from("publicaciones").update({clases:cl,est_ids:es}).eq("id",p.id);}AV.loaded=false;}catch(e){}
 log("Eliminando duplicados…");
 await delMany("ests",[...Object.keys(mapE),...P.sinE.map(e=>e.id)]);
 await delMany("cursos",P.L.c.map(c=>c.id));
 await syncOficial();fixCtx();}

/* ---------- PORTAL DEL ESTUDIANTE ---------- */
const PT={mats:[],pubs:[],err:"",loading:false,filtro:"",unirse:false,join:null,joinErr:"",q:""};let joinPend=null;
async function loadPortal(){if(PT.loading)return;PT.loading=true;$("#main").innerHTML=`<div class="load">Cargando tus clases…</div>`;
 if(joinPend){const j=joinPend;joinPend=null;await buscarClase(j.codigo);}
 try{const [m,p]=await Promise.all([sb.from("matriculas").select("*").eq("auth_uid",uid),sb.from("publicaciones").select("*").order("created_at",{ascending:false}).limit(300)]);
  if(m.error)throw m.error;if(p.error)throw p.error;PT.mats=m.data;PT.pubs=p.data;PT.err="";await firmar(PT.pubs.flatMap(x=>(x.archivos||[]).map(f=>f.path)));}catch(e){PT.err=avErr(e);}
 PT.loading=false;renderPortal();}
async function buscarClase(codigo){const {data,error}=await sb.rpc("alumnos_de_clase",{p_codigo:codigo});const r=error?{ok:false,error:"red",msg:error.message}:(data||{});
 if(!r.ok){PT.join=null;PT.unirse=true;PT.joinErr=r.error==="codigo"?"Ese código de clase no existe o está desactivado. Revísalo con tu docente.":"No fue posible consultar la clase"+(r.msg?": "+r.msg:".");return false;}
 PT.join={codigo:codigo,clase:r.clase,docente:r.docente,lista:r.alumnos||[]};PT.joinErr="";PT.unirse=true;PT.q="";return true;}
async function unirse(est){const j=PT.join;const {data,error}=await sb.rpc("unirse_clase",{p_codigo:j.codigo,p_est_id:est.id});const r=error?{ok:false,error:"red",msg:error.message}:(data||{});
 if(!r.ok){PT.joinErr=r.error==="ocupado"?`El nombre “${est.nombre}” ya fue elegido en otro dispositivo. Si eres tú, pídele a tu docente que libere tu nombre.`:r.error==="codigo"?"El código ya no está activo. Pide uno nuevo a tu docente.":r.error==="alumno"?"Ese nombre ya no está en la lista. Vuelve a buscar la clase.":"No fue posible ingresar"+(r.msg?": "+r.msg:".");await buscarClase(j.codigo);return false;}
 PT.join=null;PT.joinErr="";PT.unirse=false;toast("Bienvenido a "+(r.clase||"la clase"));return true;}
function formUnirse(){const j=PT.join,err=PT.joinErr?`<div class="banner e">${esc(PT.joinErr)}</div>`:"";
 if(!j)return `<div class="card"><h3>${PT.mats.length?"Unirme a otra clase":"Ingresa a tu clase"}</h3><label class="f">Código de clase<input type="text" id="j_c" autocapitalize="characters" autocomplete="off" placeholder="Te lo entrega tu docente"></label>${err}<button class="btn pri" id="j_ok">Continuar</button></div>`;
 const q=PT.q.trim().toLowerCase();const lista=j.lista.filter(a=>!q||a.nombre.toLowerCase().includes(q));
 return `<div class="card"><h3>${esc(j.clase)}</h3><div class="mut sm" style="margin-bottom:10px">${j.docente?esc(j.docente)+" · ":""}Busca tu nombre y tócalo.</div>${err}
 <input type="search" id="j_q" placeholder="Escribe tu apellido" value="${esc(PT.q)}" style="margin-bottom:8px"><div class="nombres">${lista.length?lista.map(a=>`<button data-alu="${esc(a.id)}" ${a.ocupado?"disabled":""}>${esc(a.nombre)}${a.mio?' <span class="tag ok">Tú</span>':a.ocupado?' <span class="tag">Ya ingresó</span>':""}</button>`).join(""):'<div class="mut sm">No hay nombres que coincidan.</div>'}</div>
 <div class="mut sm" style="margin-top:8px">¿No apareces o tu nombre ya figura como “Ya ingresó”? Avísale a tu docente.</div><button class="lnk sm" id="j_x" style="margin-top:8px">Usar otro código</button></div>`;}
function renderPortal(){
 document.body.classList.add("nologin");
 const mats=PT.mats;const nombre=(mats[0]&&mats[0].nombre||"").split(" ")[0];
 $("#who").innerHTML=`Estudiante · <button class="lnk" data-salir>Salir</button>`;
 const clases=mats.map(m=>({k:claseKey(m.curso_id,m.asig_id),t:m.clase,d:m.docente,tid:m.teacher_id}));
 const visibles=PT.pubs.filter(p=>!PT.filtro||clases.some(c=>c.k===PT.filtro&&c.tid===p.teacher_id&&(p.clases||[]).includes(c.k)));
 const clasesDe=p=>clases.filter(c=>c.tid===p.teacher_id&&(p.clases||[]).includes(c.k)).map(c=>c.t).join(", ");
 let h=`<h2>${nombre?"Hola, "+esc(nombre):"Aula virtual"}</h2>`;
 if(PT.err)h+=`<div class="banner e">${esc(PT.err)}</div>`;
 if(!mats.length)h+=formUnirse();
 else{h+=`<div class="row" style="margin-bottom:10px"><select id="pt_f" style="flex:1 1 200px"><option value="">Todas mis clases</option>${clases.map(c=>`<option value="${esc(c.k)}" ${PT.filtro===c.k?"selected":""}>${esc(c.t)}</option>`).join("")}</select><button class="btn" id="pt_r">Actualizar</button><button class="btn" id="pt_u">Otra clase</button></div>`;
  if(PT.unirse)h+=formUnirse();
  h+=visibles.length?visibles.map(p=>`<div class="card"><div class="mut sm">${esc(clasesDe(p))} · ${fLoc(p.created_at)}</div><h3 style="margin:4px 0 6px">${esc(p.titulo)}</h3>${p.cuerpo?`<div style="font-size:15px">${textoHTML(p.cuerpo)}</div>`:""}${archivosHTML(p.archivos)}</div>`).join(""):`<div class="card empty">Tu docente aún no ha publicado mensajes ni materiales.</div>`;
  h+=`<div class="mut sm" style="text-align:center;margin-top:10px">${clases.map(c=>esc(c.t)+(c.d?" · "+esc(c.d):"")).join("<br>")}</div>`;}
 $("#main").innerHTML=h;
 const jo=$("#j_ok");if(jo)jo.onclick=async()=>{const c=$("#j_c").value.trim().toUpperCase();if(!c){PT.joinErr="Escribe el código de clase.";return renderPortal();}jo.disabled=true;await buscarClase(c);renderPortal();};
 const jq=$("#j_q");if(jq)jq.oninput=()=>{PT.q=jq.value;const pos=jq.selectionStart;renderPortal();const n=$("#j_q");n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}};
 const jx=$("#j_x");if(jx)jx.onclick=()=>{PT.join=null;PT.joinErr="";renderPortal();};
 $$("[data-alu]").forEach(b=>b.onclick=async()=>{const a=PT.join.lista.find(x=>x.id===b.dataset.alu);if(!a)return;
  if(a.mio){PT.join=null;PT.unirse=false;return loadPortal();}
  if(!await ask(`¿Eres ${a.nombre}? Tu nombre quedará vinculado a este dispositivo.`,"Sí, soy yo"))return;if(await unirse(a))loadPortal();else renderPortal();});
 const f=$("#pt_f");if(f)f.onchange=()=>{PT.filtro=f.value;renderPortal();};
 const r=$("#pt_r");if(r)r.onclick=()=>loadPortal();
 const u=$("#pt_u");if(u)u.onclick=()=>{PT.unirse=!PT.unirse;PT.join=null;PT.joinErr="";renderPortal();};
}
readHash();renderNav();boot();
</script>
