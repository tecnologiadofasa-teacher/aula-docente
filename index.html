<style>

html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:10px 14px 9px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

.ctx{display:flex;gap:6px;margin-top:8px}

.ctx select{width:100%;margin-top:2px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 6px;font-size:14px;text-transform:none;letter-spacing:0}
.ctx select option{color:#111}
nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);display:flex;padding:3px 0 calc(3px + env(safe-area-inset-bottom))}

main{padding:14px 12px 96px;max-width:1150px;margin:0 auto}
@media(min-width:900px){
 nav{top:0;bottom:auto;right:auto;width:196px;height:100vh;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:70px 0 0}
 nav a{flex:0 0 auto;flex-direction:row;font-size:14.5px;gap:12px;padding:11px 20px;text-align:left}
 #app{padding-left:196px}
 main{padding:20px 22px 40px}
 .ctx label{flex:0 1 230px}
}
h2{font-size:20px;margin:2px 0 12px}
h3{font-size:16px;margin:0 0 8px}
.mut{color:var(--mut)} .sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}

.sp{flex:1}

.grid-est{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.est{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;text-align:center;cursor:pointer}

input[type=text],input[type=date],input[type=number],input[type=email],input[type=password],input[type=tel],input[type=search],input[type=url],select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 9px;background:#fff;width:100%;min-width:0}

.f{display:flex;flex-direction:column;gap:3px;margin-bottom:10px;font-size:13px;color:var(--mut);font-weight:550}
.f>input,.f>select,.f>textarea{color:var(--ink);font-weight:400;font-size:15px}

table.g td input.low{color:var(--bad);font-weight:700}

.empty{text-align:center;padding:26px 12px;color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(15,25,32,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}

.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#cf{z-index:60}

#toast div.e{background:var(--bad)}
.banner{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;background:var(--warnb);color:#5c3f00}
.banner.e{background:var(--badb);color:#7a1a14}
.banner.i{background:var(--pri2);color:#123d52}
.rows .r{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.rows .r>*{flex:1 1 0;min-width:0}
.rows .r .del{flex:0 0 32px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--bad)}
.rows .hd2{display:flex;gap:6px;font-size:11.5px;color:var(--mut);font-weight:600;margin-bottom:3px}
.rows .hd2>*{flex:1 1 0}
.rows .hd2 .del{flex:0 0 32px}
.files a{display:inline-flex;align-items:center;gap:4px;background:var(--pri2);color:var(--pri);border-radius:7px;padding:3px 8px;font-size:13px;text-decoration:none;margin:3px 4px 0 0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog div{font-size:13.5px;padding:3px 0}
.photo-pick{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 11px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--pri);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
.kv dt{color:var(--mut)} .kv dd{margin:0}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.hist button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;font-size:12.5px;cursor:pointer}
.hist button.on{border-color:var(--pri);background:var(--pri2)}
body.nologin .ctx,body.nologin nav{display:none}body.nologin #app{padding-left:0}
.login{max-width:420px;margin:24px auto}.btn.big{width:100%;padding:12px;font-size:16px}.or{text-align:center;color:var(--mut);margin:16px 0 10px;font-size:13px}
#who .lnk{color:#fff;font-weight:600}
#gear{color:#fff;display:inline-flex;margin-left:10px}#gear svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
nav .ls{display:none}
@media(max-width:899px){nav a.dsk{display:none}nav .ll{display:none}nav .ls{display:inline}}
@media(min-width:900px){#gear{display:none}}
body.nologin #gear{display:none}
.calw{overflow-x:auto;margin:0 -4px}
.cal{min-width:calc(34px + var(--cols)*56px)}
.cal-hd,.cal-bd{display:grid;grid-template-columns:34px repeat(var(--cols),minmax(56px,1fr))}
.cal-hd>div{text-align:center;font-size:12px;color:var(--mut);padding:2px 0 6px;line-height:1.1}
.cal-hd b{display:block;font-size:16px;color:var(--ink)}
.cal-hd .hoy b{background:var(--pri);color:#fff;border-radius:50%;width:28px;height:28px;line-height:28px;margin:2px auto 0}
.cal-bd{position:relative}
.cal-t{position:relative}.cal-t span{position:absolute;right:4px;transform:translateY(-50%);font-size:11px;color:var(--mut)}
.cal-c{position:relative;border-left:1px solid var(--line)}.cal-c.hoy{background:#f5f9fb}
.cal-c i{position:absolute;left:0;right:0;border-top:1px solid #eceff1}
.cal-c em{position:absolute;left:0;right:0;border-top:2px solid #d9480f;z-index:2}
.blk{position:absolute;left:3px;right:3px;border:0;border-left:3px solid;border-radius:7px;padding:3px 5px;text-align:left;cursor:pointer;overflow:hidden;font-size:11.5px;line-height:1.2;display:flex;flex-direction:column;z-index:1}
.blk b{font-size:12.5px}.blk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.blk small{opacity:.8;font-size:10.5px}
.blk .mk{position:absolute;top:2px;right:4px;font-weight:800;font-size:12px}
.blk:hover{filter:brightness(.96)}
.acc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acc button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.acc button:hover{border-color:var(--pri);background:var(--pri2)}.acc b{font-size:15px;color:var(--pri)}.acc span{font-size:12.5px;color:var(--mut)}
.slot{border:1px solid var(--line);border-radius:10px;padding:10px 10px 8px;margin-bottom:10px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;font-weight:700;letter-spacing:2px;background:var(--pri2);color:var(--pri);padding:4px 10px;border-radius:8px}
.code.off{background:#eee;color:#888;text-decoration:line-through}
.pub{border-bottom:1px solid var(--line);padding:10px 0}.pub:last-child{border-bottom:0}
.nombres{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}.nombres button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:11px 12px;font-size:15px;cursor:pointer}.nombres button:hover:not(:disabled){border-color:var(--pri);background:var(--pri2)}.nombres button:disabled{color:var(--mut);background:#f6f7f8;cursor:default}
.pickbox{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 8px;margin-bottom:10px}

.rows input[type=color]{padding:2px;height:34px;cursor:pointer}

.pie path:hover,.pie circle:hover{opacity:.85}
.mrc{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.mb{border:1px solid var(--line);background:#fff;border-radius:20px;padding:2px 9px;font-size:11.5px;cursor:pointer;color:var(--mut)}.mb.on{background:#6c3483;border-color:#6c3483;color:#fff;font-weight:600}
.msg{white-space:pre-wrap;background:#e9f7ef;border:1px solid #cdebd8;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.btn.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

<body>
<div id="app">
  <header class="top">
    <div class="brand"><b>Aula Docente</b><span class="sp"></span><span id="who"></span><a id="gear" href="#ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></a></div>
    <div class="ctx" id="ctx"></div>
  </header>
  <nav id="nav"></nav>
  <main id="main"><div class="load">Conectando con tu espacio privado…</div></main>
</div>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="cf" class="modal hidden"><div class="sheet" id="cfs" style="max-width:420px"></div></div>
<div id="toast"></div>
<script>
"use strict";
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uuid=()=>crypto.randomUUID?crypto.randomUUID():"10000000-1000-4000-8000-100000000000".replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,"0");
const hoy=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
const fFecha=f=>{if(!f)return"";const[y,m,d]=f.split("-");return `${d}/${m}/${y}`;};
const byName=(a,b)=>String(a.nombre||"").localeCompare(String(b.nombre||""),"es",{numeric:true});
const nomEst=e=>e?`${e.apellidos||""} ${e.nombres||""}`.trim():"";
function lsGet(k){try{return JSON.parse(localStorage.getItem("aula_"+k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem("aula_"+k,JSON.stringify(v));}catch(e){}}
function toast(m,err){const d=document.createElement("div");d.textContent=m;if(err)d.className="e";$("#toast").appendChild(d);setTimeout(()=>d.remove(),err?6000:2600);}
function dbMsg(e){const c=e&&String(e.code||""),m=String((e&&e.message)||"");
 if(c==="42P01"||/relation .*docs.* does not exist|Could not find the table/i.test(m))return"Falta crear la tabla en Supabase: ejecuta el archivo supabase/schema.sql.";
 if(c==="42501"||/row-level security|permission denied/i.test(m))return"Supabase rechazó la operación por permisos. Revisa las políticas de schema.sql.";
 if(/JWT|expired|refresh token/i.test(m))return"Tu sesión expiró. Vuelve a ingresar.";
 if(/Failed to fetch|NetworkError|Load failed/i.test(m))return"Sin conexión con el servidor. Revisa tu internet e inténtalo de nuevo.";
 return"No se pudo guardar"+(m?": "+m.slice(0,140):". Inténtalo de nuevo.");}

/* ---------- estado ---------- */
const CFG=window.AULA_CONFIG||{};
let sb=null,session=null,uid=null,ready=false;const downloads=true;
const driveOn=()=>!!CFG.GOOGLE_CLIENT_ID;
const S={cfg:null,cursos:{},asigs:{},ests:{},acts:{},notas:{},asis:{},evid:{}};
const COL={cursos:"cursos",asigs:"asignaturas",ests:"estudiantes",acts:"actividades",notas:"notas",asis:"asistencia",evid:"evidencias"};
const loaded=new Set();let loadWarn="",loadErr="";
const ctx=lsGet("ctx")||{};
const UI={sel:new Set(),selMode:false,visibles:[],view:"inicio",q:"",fecha:hoy(),cursoFiltro:null,evPer:"per",showComp:false};
let dirty=false;

function DEF(){const y=new Date().getFullYear();return{docente:"",institucion:"",anio:String(y),alertaFallas:3,
 periodos:[1,2,3,4].map(i=>({id:"p"+i,nombre:"Periodo "+i,inicio:"",fin:"",peso:25})),
 escala:{min:1,max:5,aprob:3,dec:1,desempenos:[{nombre:"Bajo",desde:1,hasta:2.9,color:"#c0392b"},{nombre:"Básico",desde:3,hasta:3.9,color:"#d68910"},{nombre:"Alto",desde:4,hasta:4.5,color:"#2e86c1"},{nombre:"Superior",desde:4.6,hasta:5,color:"#1e8449"}]},

async function dbSet(col,id,data){const {error}=await sb.from("docs").upsert({user_id:uid,col,id,data,updated_at:new Date().toISOString()},{onConflict:"user_id,col,id"});if(error)throw error;}
async function dbDel(col,id){const {error}=await sb.from("docs").delete().eq("user_id",uid).eq("col",col).eq("id",id);if(error)throw error;}
const wq={};
function pend(col,id){const q=wq[col+"/"+id];return q&&(q.t||q.busy);}
function queueSave(col,id,delay=700){const k=col+"/"+id;const q=wq[k]||(wq[k]={t:null,busy:false,again:false});clearTimeout(q.t);q.t=setTimeout(()=>{q.t=null;flush(col,id);},delay);}
async function flush(col,id){const k=col+"/"+id,q=wq[k];if(q.busy){q.again=true;return;}q.busy=true;
 try{const d=S[col][id];if(d)await dbSet(col,id,strip(d));else await dbDel(col,id);}catch(e){toast(dbMsg(e),true);}
 q.busy=false;if(q.again){q.again=false;flush(col,id);}}
function strip(o){const c={...o};delete c.id;return c;}
async function put(col,obj){S[col][obj.id]=obj;sched();await dbSet(col,obj.id,strip(obj));}
async function del(col,id){delete S[col][id];sched();await dbDel(col,id);}
let cfgChain=Promise.resolve();
function saveCfg(patch){const next={...cfg(),...patch};S.cfg=next;sched();cfgChain=cfgChain.then(()=>dbSet("config","config",next)).catch(e=>{toast(dbMsg(e),true);});return cfgChain;}

/* ---------- cálculo ---------- */
const num=v=>{if(v===""||v==null)return null;const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null;};
const dec=()=>{const d=+cfg().escala.dec;return isFinite(d)?d:1;};
const rnd=n=>{const f=Math.pow(10,dec());return Math.round(n*f+1e-9)/f;};
const fmt=n=>n==null?"—":rnd(n).toFixed(dec());
const comps=a=>(a&&a.componentes&&a.componentes.length)?a.componentes:[{id:"gen",nombre:"General",peso:100}];
const estsCurso=cid=>Object.values(S.ests).filter(e=>e.cursoId===cid&&e.activo!==false).sort((a,b)=>nomEst(a).localeCompare(nomEst(b),"es"));
const actsDe=(cid,aid,pid)=>Object.values(S.acts).filter(x=>x.cursoId===cid&&x.asigId===aid&&(!pid||x.perId===pid)).sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")||(a.creado||0)-(b.creado||0));
const notaAct=(aid,eid)=>num(((S.notas[aid]||{}).n||{})[eid]);
function promComp(eid,acts,cid){let s=0,w=0;for(const x of acts)if(x.compId===cid){const v=notaAct(x.id,eid);if(v!=null){const p=+x.peso||1;s+=v*p;w+=p;}}return w?s/w:null;}
function notaPer(eid,cid,aid,pid){const acts=actsDe(cid,aid,pid);let s=0,w=0;for(const c of comps(S.asigs[aid])){const m=promComp(eid,acts,c.id);if(m!=null){s+=m*(+c.peso||0);w+=(+c.peso||0);}}return w?s/w:null;}
function notaAcum(eid,cid,aid){let s=0,w=0;for(const p of cfg().periodos){const n=notaPer(eid,cid,aid,p.id);if(n!=null){s+=n*(+p.peso||0);w+=(+p.peso||0);}}return w?s/w:null;}
function desemp(n){if(n==null)return"";const r=rnd(n);const d=(cfg().escala.desempenos||[]).find(d=>r>=+d.desde-1e-9&&r<=+d.hasta+1e-9);return d?d.nombre:"";}
const DESCOL=["#c0392b","#d68910","#2e86c1","#1e8449","#7d3c98","#117a65"];
function niveles(){return (cfg().escala.desempenos||[]).map((d,i)=>({...d,color:/^#[0-9a-f]{6}$/i.test(d.color||"")?d.color:DESCOL[i%DESCOL.length]})).sort((a,b)=>+a.desde-+b.desde);}
function nivelDe(n){if(n==null)return null;const r=rnd(n);return niveles().find(d=>r>=+d.desde-1e-9&&r<=+d.hasta+1e-9)||null;}
const tinte=n=>{const d=nivelDe(n);return d?`background:${d.color}26;`:"";};
const desTag=n=>{const d=nivelDe(n);return d?`<span class="dtag"><i style="background:${d.color}"></i>${esc(d.nombre)}</span>`:"";};
const aprueba=n=>n==null?null:rnd(n)>=+cfg().escala.aprob;
const codTipo=c=>((cfg().codigos.find(x=>x.c===c))||{}).tipo||"registro";
const asisKey=(cid,aid,f)=>`${cid}__${aid}__${f}`;
const marcasCfg=()=>Array.isArray(cfg().marcas)?cfg().marcas:_def.marcas;
function resMarcas(eid,cid,aid,pid){const r={};for(const d of Object.values(S.asis)){if(d.cursoId!==cid||d.asigId!==aid||(pid&&d.perId!==pid))continue;const m=(d.extra||{})[eid];if(m)r[m]=(r[m]||0)+1;}return r;}
function resAsis(eid,cid,aid,pid){const r={ses:0,falta:0,just:0,tarde:0};for(const d of Object.values(S.asis)){if(d.cursoId!==cid||d.asigId!==aid||(pid&&d.perId!==pid))continue;const c=(d.reg||{})[eid];if(!c)continue;r.ses++;const t=codTipo(c);if(t==="falta")r.falta++;else if(t==="justificada")r.just++;else if(t==="tarde")r.tarde++;}r.pct=r.ses?Math.round(100*(r.ses-r.falta-r.just)/r.ses):null;return r;}

function vInicio(){
 const c=cfg(),cur=S.cursos[ctx.c],as=S.asigs[ctx.a],per=c.periodos.find(p=>p.id===ctx.p);
 const pasos=[[!!(S.cfg&&S.cfg.docente),"Registrar tus datos e institución","datos"],[cursosArr().length>0,"Crear al menos un curso","curso"],[Object.keys(S.asigs).length>0,"Crear una asignatura y su forma de calificar","asig"],[Object.keys(S.ests).length>0,"Registrar estudiantes con fotografía","est"],[horario().length>0,"Registrar tu horario de clases","horario"]];
 let h=`<h2>${c.docente?"Hola, "+esc(c.docente.split(" ")[0]):"Bienvenido"}</h2>`;

 h+=calH;
 if(cur&&as){

  for(const e of es){const n=notaPer(e.id,cur.id,as.id,ctx.p);if(n!=null){sp+=n;ns++;}const r=resAsis(e.id,cur.id,as.id,ctx.p);if(r.pct!=null){sa+=r.pct;na++;}
   const mot=[];if(n!=null&&!aprueba(n))mot.push("Nota "+fmt(n));if(r.falta>=(+c.alertaFallas||3))mot.push(r.falta+" fallas");if(mot.length)riesgo.push([e,mot]);}
  const nev=Object.values(S.evid).filter(v=>v.cursoId===cur.id&&v.asigId===as.id&&v.perId===ctx.p).length;
  h+=`<div class="mut sm" style="margin-bottom:8px">${esc(cur.nombre)} · ${esc(as.nombre)} · ${esc(per?per.nombre:"")}</div>
  <div class="stats"><div class="stat"><div class="v">${es.length}</div><div class="l">Estudiantes activos</div></div>
  <div class="stat"><div class="v">${ns?fmt(sp/ns):"—"}</div><div class="l">Promedio del periodo</div></div>

async function purgeEsts(ids){const set=new Set(ids);

 for(const d of Object.values(S.asis)){const r=d.reg||{};if(Object.keys(r).some(k=>set.has(k))){const rr={};for(const k in r)if(!set.has(k))rr[k]=r[k];await put("asis",{...d,reg:rr});}}

async function resizeImg(file,size=260){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const s=Math.min(img.width,img.height);const sx=(img.width-s)/2,sy=(img.height-s)*0.3;const c=document.createElement("canvas");c.width=c.height=size;c.getContext("2d").drawImage(img,sx,sy,s,s,0,0,size,size);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.82));};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"));};img.src=url;});}

let driveTok=null,driveExp=0;
function driveToken(){if(driveTok&&Date.now()<driveExp-60000)return Promise.resolve(driveTok);
 if(!driveOn())return Promise.reject({code:"noconf"});
 if(!window.google||!google.accounts||!google.accounts.oauth2)return Promise.reject({code:"nogis"});
 return new Promise((res,rej)=>{const tc=google.accounts.oauth2.initTokenClient({client_id:CFG.GOOGLE_CLIENT_ID,scope:"https://www.googleapis.com/auth/drive.file",login_hint:(session&&session.user&&session.user.email)||undefined,
  callback:r=>{if(r.error)return rej({code:"auth",message:r.error_description||r.error});driveTok=r.access_token;driveExp=Date.now()+(+r.expires_in||3600)*1000;res(driveTok);},
  error_callback:e=>rej({code:e&&e.type==="popup_closed"?"closed":"popup",message:e&&e.message})});tc.requestAccessToken({prompt:""});});}
function driveErr(e){const c=e&&e.code;
 if(c==="noconf")return"Google Drive no está configurado en esta instalación (GOOGLE_CLIENT_ID en config.js). Puedes guardar enlaces.";
 if(c==="nogis")return"No se cargó el servicio de Google. Revisa tu conexión y recarga la página.";
 if(c==="closed")return"Se cerró la ventana de Google antes de dar el permiso.";
 if(c==="popup")return"El navegador bloqueó la ventana de Google. Permite ventanas emergentes para este sitio e inténtalo de nuevo.";
 if(c==="auth")return"Google no concedió el permiso para Drive"+(e.message?": "+e.message:".");
 if(e&&e.status===404)return"No se encontró la carpeta en Drive. En Ajustes usa “Olvidar carpetas” y vuelve a intentarlo.";
 if(e&&(e.status===403||e.status===429))return"Google Drive rechazó la operación (permiso o cuota)"+(e.message?": "+e.message:".");
 if(c==="no_id")return e.message;
 return"No se pudo usar Google Drive"+(e&&e.message?": "+String(e.message).slice(0,160):". Revisa tu conexión.");}
async function gapi(url,opts={},retry=true){const tok=await driveToken();const r=await fetch(url,{...opts,headers:{...(opts.headers||{}),Authorization:"Bearer "+tok}});
 if(r.status===401&&retry){driveTok=null;return gapi(url,opts,false);}
 if(!r.ok){let m="";try{const j=await r.json();m=(j.error&&j.error.message)||"";}catch(x){}throw{code:"http",status:r.status,message:m};}
 return r;}
async function crearCarpeta(name,parent){const r=await gapi("https://www.googleapis.com/drive/v3/files?fields=id",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,mimeType:"application/vnd.google-apps.folder",...(parent?{parents:[parent]}:{})})});
 const j=await r.json();if(!j.id)throw{code:"no_id",message:"Google Drive no devolvió el identificador de la carpeta."};return j.id;}

async function subir(file,folder){const type=file.type||"application/octet-stream";const nombre=file.name||"evidencia";const meta={name:nombre,parents:[folder]};let j;
 if(file.size<=5*1024*1024){const fd=new FormData();fd.append("metadata",new Blob([JSON.stringify(meta)],{type:"application/json"}));fd.append("file",file);

 else{const ini=await gapi("https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,name,webViewLink",{method:"POST",headers:{"Content-Type":"application/json; charset=UTF-8","X-Upload-Content-Type":type},body:JSON.stringify(meta)});

 return{nombre,mime:type,size:file.size,driveId:j.id||"",link:j.webViewLink||(j.id?`https://drive.google.com/file/d/${j.id}/view`:"")};}

   for(const l of links){let n="Enlace";try{const u=new URL(l);n=u.hostname.includes("drive.google")||u.hostname.includes("docs.google")?"Archivo de Drive":u.hostname;}catch(e){}archivos.push({nombre:n,link:l});}

 });

function rowsEd(rows,fields,newRow){
 const id="re"+nid();
 const html=`<div class="rows" id="${id}"><div class="hd2">${fields.map(f=>`<span style="${f.w?`flex:0 0 ${f.w}px`:""}">${esc(f.l)}</span>`).join("")}<span class="del"></span></div><div class="body"></div><button class="btn sm" type="button" data-add>+ Agregar</button></div>`;
 const row=r=>`<div class="r" data-id="${esc(r.id||"")}">${fields.map(f=>f.opts?`<select data-k="${f.k}" style="${f.w?`flex:0 0 ${f.w}px`:""}">${Object.entries(f.opts).map(([v,l])=>`<option value="${esc(v)}" ${String(r[f.k])===v?"selected":""}>${esc(l)}</option>`).join("")}</select>`:`<input type="${f.t||"text"}" ${f.t==="number"?'step="any" inputmode="decimal"':""} data-k="${f.k}" value="${esc(r[f.k]??"")}" style="${f.w?`flex:0 0 ${f.w}px`:""}">`).join("")}<button class="del" type="button" data-del>×</button></div>`;
 return{html,mount(sh){const el=$("#"+id,sh),b=$(".body",el);b.innerHTML=rows.map(row).join("");$("[data-add]",el).onclick=()=>b.insertAdjacentHTML("beforeend",row(newRow()));el.addEventListener("click",e=>{if(e.target.dataset.del!=null)e.target.closest(".r").remove();});},
  read(){return $$("#"+id+" .r").map(r=>{const o={id:r.dataset.id||nid()};$$("[data-k]",r).forEach(i=>{const f=fields.find(x=>x.k===i.dataset.k);o[i.dataset.k]=f.t==="number"?(i.value===""?"":+String(i.value).replace(",",".")):i.value.trim();});return o;});}};
}

/* ---------- AULA VIRTUAL (docente) ---------- */
const AV={loaded:false,loading:false,err:"",codigos:[],mats:[],pubs:[],urls:{}};
const claseKey=(c,a)=>c+"|"+a;
function combosClase(){const r=[];for(const a of Object.values(S.asigs).sort(byName))for(const cid of (a.cursoIds||[])){const c=S.cursos[cid];if(c)r.push({k:claseKey(cid,a.id),c,a,nombre:`${a.nombre} · ${c.nombre}`,grado:String(c.grado||"").trim()});}return r.sort((x,y)=>x.c.nombre.localeCompare(y.c.nombre,"es",{numeric:true})||byName(x.a,y.a));}
const appURL=()=>location.origin+location.pathname;
function avErr(e){const m=String((e&&e.message)||"");if(/relation|does not exist|Could not find the table/i.test(m))return"Falta actualizar la base de datos: ejecuta de nuevo supabase/schema.sql en Supabase.";if(/Bucket not found/i.test(m))return"Falta crear el depósito de archivos: ejecuta de nuevo supabase/schema.sql.";return dbMsg(e);}
async function firmar(paths){paths=[...new Set(paths.filter(p=>p&&!AV.urls[p]))];if(!paths.length)return;try{const {data,error}=await sb.storage.from("materiales").createSignedUrls(paths,3600);if(error)throw error;for(const x of (data||[]))if(x.signedUrl)AV.urls[x.path]=x.signedUrl;}catch(e){}}
async function loadAula(){if(AV.loading)return;AV.loading=true;
 try{const [c,m,p]=await Promise.all([sb.from("codigos").select("*").eq("teacher_id",uid),sb.from("matriculas").select("*").eq("teacher_id",uid).order("nombre"),sb.from("publicaciones").select("*").eq("teacher_id",uid).order("created_at",{ascending:false}).limit(300)]);
  for(const r of [c,m,p])if(r.error)throw r.error;AV.codigos=c.data;AV.mats=m.data;AV.pubs=p.data;AV.err="";
  await firmar(AV.pubs.flatMap(x=>(x.archivos||[]).map(f=>f.path)));}catch(e){AV.err=avErr(e);}
 AV.loaded=true;AV.loading=false;if(UI.view==="aula")sched();}
function archivosHTML(arr){return `<div class="files">${(arr||[]).map(f=>f.link?`<a href="${esc(f.link)}" target="_blank" rel="noopener">${esc(f.nombre||"Enlace")}</a>`:AV.urls[f.path]?`<a href="${esc(AV.urls[f.path])}" target="_blank" rel="noopener">${esc(f.nombre)}</a>`:`<span class="tag">${esc(f.nombre)}</span>`).join("")}</div>`;}
function textoHTML(t){return esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,"<br>");}
function destinoTxt(p){const n=(p.clases||[]).map(k=>{const [c,a]=k.split("|");return S.cursos[c]&&S.asigs[a]?`${S.cursos[c].nombre} ${S.asigs[a].nombre}`:null;}).filter(Boolean);const e=(p.est_ids||[]).length;return (n.join(", ")||"Sin destinatarios")+(e?` · ${e} estudiante(s)`:" · todos");}
function vAula(){

 const cs=combosClase();

 if(AV.err)h+=`<div class="banner e">${esc(AV.err)}</div>`;
 h+=`<div class="banner i">Tus estudiantes entran en <b>${esc(appURL())}</b>, eligen “Soy estudiante”, escriben el código de su clase y tocan su nombre en la lista del curso. Cada nombre queda vinculado a un solo dispositivo; si alguien eligió un nombre equivocado, usa “Quitar acceso” para liberarlo. Solo ven las publicaciones dirigidas a su clase o a ellos.</div>`;
 h+=`<div class="card"><h3>Publicaciones</h3>${AV.pubs.length?AV.pubs.map(p=>`<div class="pub"><div class="row"><div class="sp"><b>${esc(p.titulo)}</b><div class="mut sm">${fLoc(p.created_at)} · ${esc(destinoTxt(p))}</div></div><button class="btn sm" data-pub="${esc(p.id)}">Editar</button></div>${p.cuerpo?`<div class="sm" style="margin-top:6px">${textoHTML(p.cuerpo.length>280?p.cuerpo.slice(0,280)+"…":p.cuerpo)}</div>`:""}${archivosHTML(p.archivos)}</div>`).join(""):'<div class="mut sm">Aún no has publicado mensajes ni materiales.</div>'}</div>`;
 h+=`<div class="card"><h3>Códigos de clase</h3>${cs.length?`<div class="list">${cs.map(x=>{const cod=AV.codigos.find(c=>c.curso_id===x.c.id&&c.asig_id===x.a.id);const n=AV.mats.filter(m=>m.curso_id===x.c.id&&m.asig_id===x.a.id).length;
  return `<div class="it" style="flex-wrap:wrap"><div class="nm"><b>${esc(x.nombre)}</b><span class="mut sm">${n} estudiante(s) conectado(s)</span></div>${cod?`<span class="code ${cod.activo?"":"off"}">${esc(cod.codigo)}</span><div class="row" style="gap:4px"><button class="btn sm" data-cod="copiar" data-id="${cod.id}">Copiar invitación</button><button class="btn sm" data-cod="nuevo" data-id="${cod.id}">Cambiar</button><button class="btn sm ${cod.activo?"dan":""}" data-cod="${cod.activo?"off":"on"}" data-id="${cod.id}">${cod.activo?"Desactivar":"Activar"}</button></div>`:`<button class="btn sm pri" data-cod="crear" data-k="${esc(x.k)}">Generar código</button>`}</div>`;}).join("")}</div>`:'<div class="mut sm">Crea cursos y asígnalos a tus asignaturas para generar códigos.</div>'}
 <div class="mut sm" style="margin-top:8px">Cambiar el código impide nuevos ingresos con el anterior; los estudiantes ya conectados siguen dentro. Desactivarlo bloquea a toda la clase.</div></div>`;
 const porClase={};for(const m of AV.mats)(porClase[claseKey(m.curso_id,m.asig_id)]=porClase[claseKey(m.curso_id,m.asig_id)]||[]).push(m);
 h+=`<div class="card"><h3>Estudiantes conectados</h3>${Object.keys(porClase).length?Object.entries(porClase).map(([k,ms])=>{const x=cs.find(c=>c.k===k);return `<div style="margin-bottom:10px"><div class="sm" style="font-weight:650;margin-bottom:4px">${esc(x?x.nombre:"Clase eliminada")}</div><div class="list">${ms.map(m=>{const e=S.ests[m.est_id];return `<div class="it">${e?av(e,"s"):""}<div class="nm"><b>${esc(e?nomEst(e):m.nombre)}</b><span class="mut sm">Desde ${fLoc(m.created_at)}</span></div><button class="btn sm dan" data-quitar="${esc(m.id)}">Quitar acceso</button></div>`;}).join("")}</div></div>`;}).join(""):'<div class="mut sm">Ningún estudiante ha ingresado todavía.</div>'}</div>`;
 return h;
}
const CHARS="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const nuevoCod=()=>Array.from(crypto.getRandomValues(new Uint32Array(7))).map(n=>CHARS[n%CHARS.length]).join("");
async function accionCodigo(op,el){
 try{
  if(op==="crear"){const [cid,aid]=el.dataset.k.split("|");const c=S.cursos[cid],a=S.asigs[aid];
   for(let i=0;i<6;i++){const {error}=await sb.from("codigos").insert({teacher_id:uid,codigo:nuevoCod(),curso_id:cid,asig_id:aid,nombre:`${a.nombre} · ${c.nombre}`,grado:String(c.grado||""),docente:cfg().docente||""});if(!error)break;if(error.code!=="23505"||i===5)throw error;}
   toast("Código creado");}
  else{const cod=AV.codigos.find(c=>c.id===el.dataset.id);if(!cod)return;
   if(op==="copiar"){const t=`Únete a la clase ${cod.nombre} en Aula Docente:\n1. Abre ${appURL()}\n2. Elige "Soy estudiante".\n3. Escribe el código ${cod.codigo} y toca tu nombre en la lista.`;
    try{await navigator.clipboard.writeText(t);toast("Invitación copiada. Pégala en WhatsApp o en el correo.");}catch(e){openModal(`<div class="hd"><h3>Invitación</h3><button class="x" data-close>×</button></div><textarea style="min-height:140px" readonly>${esc(t)}</textarea><p class="sm mut">Selecciona el texto y cópialo.</p>`);}return;}
   if(op==="nuevo"){if(!await ask("Se generará un código nuevo y el actual dejará de servir para nuevos ingresos. Los estudiantes ya conectados siguen dentro. ¿Continuar?","Cambiar código"))return;
    for(let i=0;i<6;i++){const {error}=await sb.from("codigos").update({codigo:nuevoCod()}).eq("id",cod.id);if(!error)break;if(error.code!=="23505"||i===5)throw error;}toast("Código cambiado");}
   if(op==="off"||op==="on"){if(op==="off"&&!await ask("Mientras el código esté desactivado nadie podrá ingresar y los estudiantes conectados dejarán de ver las publicaciones de esta clase. ¿Desactivar?","Desactivar",true))return;
    const {error}=await sb.from("codigos").update({activo:op==="on"}).eq("id",cod.id);if(error)throw error;}
  }
 }catch(e){toast(avErr(e),true);}
 await loadAula();
}

 p=p?{...p}:{id:uuid(),titulo:"",cuerpo:"",clases:pre.clases||(ctx.c&&ctx.a?[claseKey(ctx.c,ctx.a)]:[]),est_ids:[],archivos:[]};

 <label class="chk"><input type="checkbox" id="p_alg" ${(p.est_ids||[]).length?"checked":""}><span>Solo para algunos estudiantes</span></label><div id="p_es" class="pickbox" style="${(p.est_ids||[]).length?"":"display:none"}"></div>

function pieSVG(datos,total,titulo){
 const W=560,H=300,cx=150,cy=165,r=112;let a0=-Math.PI/2,sl="";
 const nz=datos.filter(d=>d.v>0);
 for(const d of datos){if(!d.v)continue;const pct=Math.round(1000*d.v/total)/10;const tip=`<title>${esc(d.nombre)}: ${d.v} estudiante(s), ${pct}%</title>`;
  if(nz.length===1){sl+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${d.color}">${tip}</circle>`;break;}
  const a1=a0+2*Math.PI*d.v/total;const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
  sl+=`<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${d.color}" stroke="#fff" stroke-width="2" stroke-linejoin="round">${tip}</path>`;
  const am=(a0+a1)/2;if(d.v/total>=0.06)sl+=`<text x="${(cx+r*0.64*Math.cos(am)).toFixed(1)}" y="${(cy+r*0.64*Math.sin(am)).toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#fff" pointer-events="none">${Math.round(100*d.v/total)}%</text>`;
  a0=a1;}
 const ley=datos.map((d,i)=>{const y=96+i*30;return `<rect x="300" y="${y-9}" width="14" height="14" rx="3" fill="${d.color}"/><text x="322" y="${y}" font-size="14" fill="#1b2630" dominant-baseline="central">${esc(d.nombre)} <tspan fill="#5b6872" font-size="12">(${esc(d.rango)})</tspan></text><text x="${W-14}" y="${y}" font-size="14" fill="#1b2630" text-anchor="end" dominant-baseline="central" font-weight="700">${d.v} · ${Math.round(1000*d.v/total)/10}%</text>`;}).join("");
 return `<svg class="pie" viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Distribución por nivel de desempeño" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" style="max-width:${W}px;display:block;margin:0 auto">
 <rect width="${W}" height="${H}" fill="#fff"/><text x="14" y="24" font-size="15" font-weight="700" fill="#1b2630">Distribución por nivel de desempeño</text><text x="14" y="44" font-size="12" fill="#5b6872">${esc(titulo)} · ${total} estudiante(s) con nota</text>${sl}${ley}</svg>`;
}
function svgPNG(svg,nombre){if(!svg)return;const xml=new XMLSerializer().serializeToString(svg);const img=new Image();const vb=svg.viewBox.baseVal;const k=2;
 img.onload=()=>{const c=document.createElement("canvas");c.width=vb.width*k;c.height=vb.height*k;const g=c.getContext("2d");g.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{if(!b)return toast("No se pudo generar la imagen.",true);const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);},"image/png");};
 img.onerror=()=>toast("No se pudo generar la imagen.",true);img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(xml);}

 ${bloques.map((b,bi)=>`<div class="card" style="padding:12px"><div class="row"><b class="sp">Curso ${esc(b.cu.nombre)}</b><span class="mut sm">${b.docs.length?b.docs.length+" clase(s) registrada(s)":"Sin asistencia tomada"}</span></div>
  ${b.lista.length?`<div class="list">${b.lista.map((x,i)=>{const w=telWA(x.e.telefono);return `<div class="it">${av(x.e,"s")}<div class="nm"><b>${esc(nomEst(x.e))}</b><span class="mut sm">${esc(x.det.map(d=>d.txt).join(" · "))}${x.e.acudiente?" · Acudiente: "+esc(x.e.acudiente):""}</span></div>${w?`<a class="btn sm wa" href="https://wa.me/${w}?text=${encodeURIComponent(msgFam(b,x))}" target="_blank" rel="noopener">WhatsApp</a>`:'<span class="mut sm">Sin teléfono</span>'}</div>`;}).join("")}</div>
  <div class="msg">${esc(msgCurso(b))}</div><div class="row" style="margin-top:8px"><button class="btn sm pri" data-cp="${bi}">Copiar mensaje</button><a class="btn sm wa" href="https://wa.me/?text=${encodeURIComponent(msgCurso(b))}" target="_blank" rel="noopener">Abrir en WhatsApp</a></div>`:`<div class="mut sm" style="margin-top:6px">${b.docs.length?"Sin novedades.":"No hay registro de asistencia de este curso en la fecha."}</div>`}</div>`).join("")}
 <details style="margin-top:6px"><summary class="sm"><b>Editar plantillas de mensaje</b></summary>
  <p class="sm mut">Puedes usar: {institucion}, {fecha}, {curso}, {titulo}, {lista}, {docente}; en el individual también {estudiante}, {acudiente} y {detalle}. En WhatsApp, el texto entre *asteriscos* sale en negrita.</p>
  <label class="f">Mensaje para el grupo del curso<textarea id="in_tg" style="min-height:150px">${esc(tg)}</textarea></label>
  <label class="f">Mensaje individual a cada familia<textarea id="in_tf" style="min-height:100px">${esc(tf)}</textarea></label>
  <div class="row"><button class="btn sm pri" id="in_sv">Guardar plantillas</button><button class="btn sm" id="in_rs">Restaurar originales</button></div></details>`,sh=>{
  sh.addEventListener("change",ev=>{const t=ev.target;if(t.id==="in_f"){F.fecha=t.value||hoy();inasistencias();}else if(t.id==="in_c"){F.curso=t.value;inasistencias();}else if(t.dataset.op){F[t.dataset.op]=t.checked;inasistencias();}});
  sh.addEventListener("click",ev=>{const b=ev.target.closest("[data-cp]");if(b)copiar(msgCurso(bloques[+b.dataset.cp]));});
  $("#in_sv",sh).onclick=async()=>{await saveCfg({msgGrupo:$("#in_tg").value,msgFamilia:$("#in_tf").value});toast("Plantillas guardadas");inasistencias();};
  $("#in_rs",sh).onclick=async()=>{await saveCfg({msgGrupo:"",msgFamilia:""});inasistencias();};
 });
}

/* ---------- PORTAL DEL ESTUDIANTE ---------- */
const PT={mats:[],pubs:[],err:"",loading:false,filtro:"",unirse:false,join:null,joinErr:"",q:""};let joinPend=null;
async function loadPortal(){if(PT.loading)return;PT.loading=true;$("#main").innerHTML=`<div class="load">Cargando tus clases…</div>`;
 if(joinPend){const j=joinPend;joinPend=null;await buscarClase(j.codigo);}
 try{const [m,p]=await Promise.all([sb.from("matriculas").select("*").eq("auth_uid",uid),sb.from("publicaciones").select("*").order("created_at",{ascending:false}).limit(300)]);
  if(m.error)throw m.error;if(p.error)throw p.error;PT.mats=m.data;PT.pubs=p.data;PT.err="";await firmar(PT.pubs.flatMap(x=>(x.archivos||[]).map(f=>f.path)));}catch(e){PT.err=avErr(e);}
 PT.loading=false;renderPortal();}
async function buscarClase(codigo){const {data,error}=await sb.rpc("alumnos_de_clase",{p_codigo:codigo});const r=error?{ok:false,error:"red",msg:error.message}:(data||{});
 if(!r.ok){PT.join=null;PT.unirse=true;PT.joinErr=r.error==="codigo"?"Ese código de clase no existe o está desactivado. Revísalo con tu docente.":"No fue posible consultar la clase"+(r.msg?": "+r.msg:".");return false;}
 PT.join={codigo:codigo,clase:r.clase,docente:r.docente,lista:r.alumnos||[]};PT.joinErr="";PT.unirse=true;PT.q="";return true;}
async function unirse(est){const j=PT.join;const {data,error}=await sb.rpc("unirse_clase",{p_codigo:j.codigo,p_est_id:est.id});const r=error?{ok:false,error:"red",msg:error.message}:(data||{});
 if(!r.ok){PT.joinErr=r.error==="ocupado"?`El nombre “${est.nombre}” ya fue elegido en otro dispositivo. Si eres tú, pídele a tu docente que libere tu nombre.`:r.error==="codigo"?"El código ya no está activo. Pide uno nuevo a tu docente.":r.error==="alumno"?"Ese nombre ya no está en la lista. Vuelve a buscar la clase.":"No fue posible ingresar"+(r.msg?": "+r.msg:".");await buscarClase(j.codigo);return false;}
 PT.join=null;PT.joinErr="";PT.unirse=false;toast("Bienvenido a "+(r.clase||"la clase"));return true;}
function formUnirse(){const j=PT.join,err=PT.joinErr?`<div class="banner e">${esc(PT.joinErr)}</div>`:"";
 if(!j)return `<div class="card"><h3>${PT.mats.length?"Unirme a otra clase":"Ingresa a tu clase"}</h3><label class="f">Código de clase<input type="text" id="j_c" autocapitalize="characters" autocomplete="off" placeholder="Te lo entrega tu docente"></label>${err}<button class="btn pri" id="j_ok">Continuar</button></div>`;
 const q=PT.q.trim().toLowerCase();const lista=j.lista.filter(a=>!q||a.nombre.toLowerCase().includes(q));
 return `<div class="card"><h3>${esc(j.clase)}</h3><div class="mut sm" style="margin-bottom:10px">${j.docente?esc(j.docente)+" · ":""}Busca tu nombre y tócalo.</div>${err}
 <input type="search" id="j_q" placeholder="Escribe tu apellido" value="${esc(PT.q)}" style="margin-bottom:8px"><div class="nombres">${lista.length?lista.map(a=>`<button data-alu="${esc(a.id)}" ${a.ocupado?"disabled":""}>${esc(a.nombre)}${a.mio?' <span class="tag ok">Tú</span>':a.ocupado?' <span class="tag">Ya ingresó</span>':""}</button>`).join(""):'<div class="mut sm">No hay nombres que coincidan.</div>'}</div>
 <div class="mut sm" style="margin-top:8px">¿No apareces o tu nombre ya figura como “Ya ingresó”? Avísale a tu docente.</div><button class="lnk sm" id="j_x" style="margin-top:8px">Usar otro código</button></div>`;}
function renderPortal(){
 document.body.classList.add("nologin");
 const mats=PT.mats;const nombre=(mats[0]&&mats[0].nombre||"").split(" ")[0];
 $("#who").innerHTML=`Estudiante · <button class="lnk" data-salir>Salir</button>`;
 const clases=mats.map(m=>({k:claseKey(m.curso_id,m.asig_id),t:m.clase,d:m.docente,tid:m.teacher_id}));
 const visibles=PT.pubs.filter(p=>!PT.filtro||clases.some(c=>c.k===PT.filtro&&c.tid===p.teacher_id&&(p.clases||[]).includes(c.k)));
 const clasesDe=p=>clases.filter(c=>c.tid===p.teacher_id&&(p.clases||[]).includes(c.k)).map(c=>c.t).join(", ");
 let h=`<h2>${nombre?"Hola, "+esc(nombre):"Aula virtual"}</h2>`;
 if(PT.err)h+=`<div class="banner e">${esc(PT.err)}</div>`;
 if(!mats.length)h+=formUnirse();
 else{h+=`<div class="row" style="margin-bottom:10px"><select id="pt_f" style="flex:1 1 200px"><option value="">Todas mis clases</option>${clases.map(c=>`<option value="${esc(c.k)}" ${PT.filtro===c.k?"selected":""}>${esc(c.t)}</option>`).join("")}</select><button class="btn" id="pt_r">Actualizar</button><button class="btn" id="pt_u">Otra clase</button></div>`;
  if(PT.unirse)h+=formUnirse();
  h+=visibles.length?visibles.map(p=>`<div class="card"><div class="mut sm">${esc(clasesDe(p))} · ${fLoc(p.created_at)}</div><h3 style="margin:4px 0 6px">${esc(p.titulo)}</h3>${p.cuerpo?`<div style="font-size:15px">${textoHTML(p.cuerpo)}</div>`:""}${archivosHTML(p.archivos)}</div>`).join(""):`<div class="card empty">Tu docente aún no ha publicado mensajes ni materiales.</div>`;
  h+=`<div class="mut sm" style="text-align:center;margin-top:10px">${clases.map(c=>esc(c.t)+(c.d?" · "+esc(c.d):"")).join("<br>")}</div>`;}
 $("#main").innerHTML=h;
 const jo=$("#j_ok");if(jo)jo.onclick=async()=>{const c=$("#j_c").value.trim().toUpperCase();if(!c){PT.joinErr="Escribe el código de clase.";return renderPortal();}jo.disabled=true;await buscarClase(c);renderPortal();};
 const jq=$("#j_q");if(jq)jq.oninput=()=>{PT.q=jq.value;const pos=jq.selectionStart;renderPortal();const n=$("#j_q");n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}};
 const jx=$("#j_x");if(jx)jx.onclick=()=>{PT.join=null;PT.joinErr="";renderPortal();};
 $$("[data-alu]").forEach(b=>b.onclick=async()=>{const a=PT.join.lista.find(x=>x.id===b.dataset.alu);if(!a)return;
  if(a.mio){PT.join=null;PT.unirse=false;return loadPortal();}
  if(!await ask(`¿Eres ${a.nombre}? Tu nombre quedará vinculado a este dispositivo.`,"Sí, soy yo"))return;if(await unirse(a))loadPortal();else renderPortal();});
 const f=$("#pt_f");if(f)f.onchange=()=>{PT.filtro=f.value;renderPortal();};
 const r=$("#pt_r");if(r)r.onclick=()=>loadPortal();
 const u=$("#pt_u");if(u)u.onclick=()=>{PT.unirse=!PT.unirse;PT.join=null;PT.joinErr="";renderPortal();};
}
readHash();renderNav();boot();
</script>
</body>
